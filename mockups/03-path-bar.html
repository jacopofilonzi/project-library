<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 · Path bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1b1a17; --panel: #22211d; --line: #34322c; --ink: #ebe6da; --mute: #8f897a; --accent: #f2b84b; --sel: #2f2c25; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.5 'Martian Mono', ui-monospace, monospace; }
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
  .path { display: flex; align-items: center; gap: 0; padding: 18px 22px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .path .seg { color: var(--mute); cursor: pointer; }
  .path .seg:hover { color: var(--ink); text-decoration: underline; }
  .path .slash { color: #5d584c; }
  .path .glob { color: var(--accent); }
  .path input { flex: 1; min-width: 80px; background: transparent; border: 0; outline: none; color: var(--accent); font: inherit; caret-color: var(--accent); }
  .path .ghost { color: #5d584c; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; }
  .list { overflow-y: auto; padding: 8px 0; border-right: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; padding: 6px 22px; cursor: pointer; align-items: baseline; }
  .row.on { background: var(--sel); }
  .row.on .nm::before { content: '▸ '; color: var(--accent); }
  .row .k { color: var(--mute); }
  .row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm.dir { color: #b9d27a; }
  .row .rt { color: var(--mute); font-size: 11px; }
  .row.glob .nm { color: var(--accent); }
  .sep { color: #5d584c; padding: 10px 22px 4px; font-size: 11px; }
  mark { background: none; color: var(--accent); text-decoration: underline; }
  .prev { padding: 26px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: var(--panel); }
  .prev .lbl { color: var(--mute); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
  .prev h1 { margin: 0; font-size: 22px; font-weight: 700; word-break: break-word; }
  .prev p { margin: 0; color: #cfc9ba; font-weight: 300; line-height: 1.7; }
  .prev .kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 12px; font-size: 12px; }
  .prev .kv span:nth-child(odd) { color: var(--mute); }
  .btns { display: flex; flex-direction: column; gap: 6px; }
  .btns button { display: flex; justify-content: space-between; background: transparent; border: 1px solid var(--line); color: var(--ink); font: inherit; padding: 10px 12px; cursor: pointer; text-align: left; }
  .btns button:hover, .btns button:first-child { border-color: var(--accent); }
  .btns button:first-child { background: var(--accent); color: #1b1a17; font-weight: 700; }
  .btns small { opacity: .7; }
  .status { display: flex; gap: 22px; padding: 8px 22px; border-top: 1px solid var(--line); color: var(--mute); font-size: 11px; }
  .status b { color: var(--ink); font-weight: 500; }
  .status .sp { flex: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="path" id="pathbar"></div>
  <div class="body">
    <div class="list" id="list" role="listbox" aria-label="Contenuto"></div>
    <aside class="prev" id="prev"></aside>
  </div>
  <div class="status">
    <span><b>Tab</b> completa</span><span><b>/</b> entra nella cartella</span><span><b>⌫</b> risale</span><span><b>**/</b> o <b>Ctrl ↵</b> ovunque</span>
    <span class="sp"></span><span id="count"></span>
  </div>
</div>

<script src="shared/data.js"></script>
<script>
const S = { path: ['github', 'jacopofilonzi'], q: '', global: false, idx: 0 };
let items = [];
const $ = (id) => document.getElementById(id);

function pathbar() {
  const segs = S.global
    ? `<span class="seg" data-up="0">~/Development</span><span class="slash">/</span><span class="glob">**</span><span class="slash">/</span>`
    : `<span class="seg" data-up="0">~/Development</span><span class="slash">/</span>` + S.path.map((s, i) => `<span class="seg" data-up="${i + 1}">${PL.esc(s)}</span><span class="slash">/</span>`).join('');
  $('pathbar').innerHTML = segs + `<label for="q" style="position:absolute;left:-9999px">Filtro</label><input id="q" autocomplete="off" spellcheck="false">`;
  const q = $('q'); q.value = S.q; q.focus();
  q.addEventListener('input', () => {
    if (q.value.startsWith('**/')) { S.global = true; S.q = q.value.slice(3); S.idx = 0; pathbar(); list(); return; }
    if (q.value.endsWith('/')) {
      const name = q.value.slice(0, -1).toLowerCase();
      const dir = PL.sorted(PL.get(S.path)).find((c) => c.type === 'dir' && c.name.toLowerCase().startsWith(name));
      if (dir && !S.global) { S.path.push(dir.name); S.q = ''; S.idx = 0; pathbar(); list(); return; }
    }
    S.q = q.value; S.idx = 0; list();
  });
  q.addEventListener('keydown', onKey);
}

function list() {
  items = [];
  let html = '';
  if (!S.q && !S.global) {
    PL.sorted(PL.get(S.path)).forEach((c) => items.push(c.type === 'dir' ? { kind: 'dir', node: c } : { kind: 'proj', node: c, path: S.path }));
    html = items.map(row).join('');
  } else {
    const r = PL.search(S.q, S.global ? [] : S.path);
    r.here.forEach((e) => items.push({ kind: 'proj', node: e.project, path: e.path, rel: S.global ? e.path.join('/') : PL.rel(e.path, S.path) }));
    // anche le sottocartelle che matchano, solo nella cartella corrente
    if (!S.global) PL.sorted(PL.get(S.path)).filter((c) => c.type === 'dir' && c.name.toLowerCase().includes(S.q.toLowerCase())).forEach((c) => items.unshift({ kind: 'dir', node: c }));
    html = items.map(row).join('');
    if (!S.global && S.path.length) {
      items.push({ kind: 'glob', n: r.elsewhere.length });
      html += `<div class="sep">── fuori da ${PL.esc(S.path.at(-1))} ──</div>` + row(items.at(-1), items.length - 1);
    }
  }
  $('list').innerHTML = html || '<div class="sep">nessun risultato</div>';
  $('count').textContent = `${items.filter((i) => i.kind === 'proj').length} progetti`;
  preview();
}

function row(it, i) {
  const on = i === S.idx ? ' on' : '';
  if (it.kind === 'glob') return `<div class="row glob${on}" data-i="${i}"><span class="k">**</span><span class="nm">cerca "${PL.esc(S.q)}" ovunque</span><span class="rt">+${it.n} · Ctrl ↵</span></div>`;
  if (it.kind === 'dir') return `<div class="row${on}" data-i="${i}"><span class="k">d</span><span class="nm dir">${PL.highlight(it.node.name, S.q)}/</span><span class="rt">${PL.count(it.node)}</span></div>`;
  return `<div class="row${on}" data-i="${i}"><span class="k" style="color:${PL.LANG[it.node.lang]}">●</span><span class="nm">${PL.highlight(it.node.name, S.q)}</span><span class="rt">${PL.esc(it.rel || '')}</span></div>`;
}

function preview() {
  const it = items[S.idx];
  if (!it) { $('prev').innerHTML = ''; return; }
  if (it.kind === 'glob') { $('prev').innerHTML = `<span class="lbl">ricerca globale</span><p>Ripete la ricerca su tutto ~/Development. Trovati ${it.n} progetti fuori dalla cartella corrente.</p>`; return; }
  if (it.kind === 'dir') {
    const kids = PL.sorted(it.node);
    $('prev').innerHTML = `<span class="lbl">cartella</span><h1>${PL.esc(it.node.name)}/</h1><div class="kv"><span>progetti</span><span>${PL.count(it.node)}</span><span>contenuto</span><span>${kids.slice(0, 6).map((k) => PL.esc(k.name) + (k.type === 'dir' ? '/' : '')).join('<br>')}${kids.length > 6 ? '<br>…' : ''}</span></div><div class="btns"><button data-enter>Entra <small>/ o ↵</small></button><button data-launch="explorer">Esplora file <small>Ctrl E</small></button></div>`;
    return;
  }
  const p = it.node;
  $('prev').innerHTML = `<span class="lbl">progetto · ${p.lang}</span><h1>${PL.esc(p.name)}</h1><p>${p.desc ? PL.esc(p.desc) : '<span style="color:var(--mute)">nessuna descrizione</span>'}</p>
    <div class="kv"><span>path</span><span>~/Development/${PL.esc([...it.path, p.name].join('/'))}</span><span>tipo</span><span>${p.lang}</span></div>
    <div class="btns">${PL.LAUNCHERS.map((l) => `<button data-launch="${l.id}">${l.label} <small>${l.key}</small></button>`).join('')}</div>`;
}

function activate(launcher) {
  const it = items[S.idx];
  if (!it) return;
  if (it.kind === 'dir' && !launcher) { S.path.push(it.node.name); S.q = ''; S.idx = 0; pathbar(); list(); }
  else if (it.kind === 'glob') { S.global = true; S.idx = 0; pathbar(); list(); }
  else if (it.kind === 'proj' || launcher) PL.launch(launcher || 'vscode', it.node);
}

function onKey(e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); S.idx = Math.min(items.length - 1, S.idx + 1); list(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); S.idx = Math.max(0, S.idx - 1); list(); }
  else if (e.key === 'Tab') { e.preventDefault(); const it = items[S.idx]; if (it && it.kind === 'dir') { S.path.push(it.node.name); S.q = ''; S.idx = 0; pathbar(); list(); } }
  else if (e.key === 'Enter' && e.ctrlKey) { S.global = true; S.idx = 0; pathbar(); list(); }
  else if (e.key === 'Enter') activate();
  else if (e.ctrlKey && e.key === '2') { e.preventDefault(); activate('intellij'); }
  else if (e.ctrlKey && e.key.toLowerCase() === 'e') { e.preventDefault(); activate('explorer'); }
  else if (e.key === 'Backspace' && !e.target.value) { if (S.global) S.global = false; else S.path.pop(); S.idx = 0; pathbar(); list(); }
  else if (e.key === 'Escape') { S.q = ''; S.global = false; S.idx = 0; pathbar(); list(); }
}

document.addEventListener('click', (e) => {
  const up = e.target.closest('[data-up]');
  if (up) { S.path = S.path.slice(0, +up.dataset.up); S.global = false; S.q = ''; S.idx = 0; pathbar(); list(); return; }
  const r = e.target.closest('.row');
  if (r) { if (+r.dataset.i === S.idx) activate(); else { S.idx = +r.dataset.i; list(); } $('q').focus(); return; }
  const l = e.target.closest('[data-launch]');
  if (l) { activate(l.dataset.launch); return; }
  if (e.target.closest('[data-enter]')) activate();
});
pathbar(); list();
</script>
</body>
</html>
