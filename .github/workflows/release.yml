# Windows build (compiled on Linux, which costs half the minutes) and release. It does not run on every push: only when a v* tag
# is pushed (creates the release with the installer attached) or by hand from Actions → Release → Run workflow (installer as an artifact, no release).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Wails on Windows does not use cgo: without cgo we compile for Windows from Linux and vet the other systems
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag version matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app=$(grep -E '^\s+version:\s*"' build/config.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but build/config.yml says $app"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wails CLI (same version as go.mod)
        run: |
          v=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$v"

      - name: Dependencies, bindings and frontend
        run: |
          (cd frontend && npm ci)
          GOOS=windows wails3 generate bindings -clean=true -ts -i
          # main.go embeds frontend/dist: without the build go vet does not compile
          (cd frontend && npm run build)

      - name: Test Go
        run: |
          GOOS=windows go vet ./...
          # internal/core imports Wails, which needs cgo outside Windows: here we check and test the rest
          # (go test compiles packages without tests too). internal/core stays covered by the Windows vet.
          pkgs=$(go list ./internal/... | grep -v /internal/core)
          GOOS=darwin go vet $pkgs
          go vet $pkgs
          go test $pkgs

      - name: Type check
        working-directory: frontend
        run: npm run check -- --fail-on-warnings

      - name: Test e2e
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis

      - name: Installer
        env:
          GOOS: windows
        run: wails3 package GOOS=windows ARCH=amd64

      - name: Artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: project-library-installer
          path: bin/project-library-amd64-installer.exe
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          {
            echo "## What's new"
            echo
            git log "$range" --no-merges --pretty='- %s' | grep -vE '^- chore: (release|version)' || true
          } > notes.md
          gh release create "$GITHUB_REF_NAME" bin/project-library-amd64-installer.exe \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
