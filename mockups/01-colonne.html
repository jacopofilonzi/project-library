<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 · Colonne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f1; --panel: #fff; --line: #e4e4de; --ink: #17171a; --mute: #6b6b70;
    --accent: #2347ff; --accent-soft: #e8ecff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 Geist, system-ui, sans-serif; }
  .app { height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .logo { font-weight: 700; letter-spacing: -.02em; }
  .logo span { color: var(--accent); }
  .crumbs { display: flex; gap: 4px; align-items: center; font-family: 'Geist Mono', monospace; font-size: 13px; flex: 1; min-width: 0; }
  .crumbs button { background: none; border: 0; font: inherit; color: var(--mute); padding: 4px 6px; border-radius: 4px; cursor: pointer; }
  .crumbs button:hover { background: var(--bg); color: var(--ink); }
  .crumbs button:last-child { color: var(--ink); font-weight: 500; }
  .crumbs i { color: #b5b5b0; font-style: normal; }
  .search { display: flex; align-items: center; gap: 6px; width: 420px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 4px 4px 10px; }
  .search:focus-within { border-color: var(--accent); background: #fff; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; border-radius: 5px; padding: 3px 4px 3px 8px; white-space: nowrap; }
  .chip.global { background: var(--ink); color: #fff; padding-right: 8px; }
  .chip button { background: none; border: 0; color: inherit; cursor: pointer; font: inherit; padding: 0 3px; }
  .search input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; outline: none; padding: 6px 0; }
  kbd { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--mute); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; background: #fff; }

  main { flex: 1; min-height: 0; display: flex; overflow-x: auto; }
  .col { width: 260px; flex: none; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 6px; }
  .row { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; font: inherit; color: inherit; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .row:hover { background: var(--bg); }
  .row.on { background: var(--accent); color: #fff; }
  .row.on .n, .row.on .chev { color: rgba(255,255,255,.8); }
  .row .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .n { font-size: 12px; color: var(--mute); font-family: 'Geist Mono', monospace; }
  .row .chev { color: #b5b5b0; }
  .ico { width: 16px; height: 16px; flex: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; margin: 0 3px; }

  .detail { flex: 1; min-width: 380px; padding: 40px 44px; display: flex; flex-direction: column; gap: 18px; }
  .detail .path { font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--mute); }
  .detail h1 { margin: 0; font-size: 40px; letter-spacing: -.03em; line-height: 1.05; word-break: break-word; }
  .detail p { margin: 0; font-size: 16px; color: #3c3c40; max-width: 560px; }
  .detail p.none { color: var(--mute); font-style: italic; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mute); }
  .actions { display: flex; flex-direction: column; gap: 8px; max-width: 360px; margin-top: 8px; }
  .act { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .act:hover { border-color: var(--ink); }
  .act.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .act.primary kbd { background: transparent; color: #bbb; border-color: #444; }
  .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--mute); }

  .results { flex: 1; overflow-y: auto; padding: 18px 20px; background: var(--panel); }
  .results h2 { font-size: 12px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; margin: 6px 0 8px; }
  .res { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .res:hover { background: var(--bg); }
  .res .t { font-weight: 600; }
  .res .s { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .s code { font-family: 'Geist Mono', monospace; }
  .res .mini { display: flex; gap: 4px; }
  .res .mini button { background: #fff; border: 1px solid var(--line); border-radius: 5px; font: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer; }
  .res .mini button:hover { border-color: var(--ink); }
  .global-row { display: flex; align-items: center; gap: 12px; width: 100%; margin: 14px 0; padding: 12px 14px; background: var(--accent-soft); color: var(--accent); border: 1px dashed var(--accent); border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; text-align: left; }
  .global-row span { flex: 1; }
  mark { background: #ffe58a; color: inherit; border-radius: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">project<span>/</span>library</div>
    <nav class="crumbs" id="crumbs" aria-label="Percorso"></nav>
    <div class="search">
      <span id="scope"></span>
      <label for="q" style="position:absolute;left:-9999px">Cerca</label>
      <input id="q" placeholder="Cerca…" autocomplete="off">
      <kbd>/</kbd>
    </div>
  </header>
  <main id="view"></main>
</div>

<script src="shared/data.js"></script>
<script>
const S = { path: ['github', 'jacopofilonzi'], sel: 'TimeTable', q: '', global: false };
const $ = (id) => document.getElementById(id);
const folder = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3z"/></svg>';

function render() {
  // breadcrumb
  const segs = ['Development', ...S.path];
  $('crumbs').innerHTML = segs.map((s, i) => `<button data-up="${i}">${PL.esc(s)}</button>`).join('<i>/</i>');
  // chip di scope
  const here = S.path.length ? S.path[S.path.length - 1] : 'Development';
  $('scope').innerHTML = S.global
    ? `<span class="chip global">ovunque</span>`
    : `<span class="chip">in ${PL.esc(here)}${S.path.length ? '<button title="Cerca ovunque" data-global>×</button>' : ''}</span>`;
  S.q ? renderSearch() : renderColumns();
}

function renderColumns() {
  let html = '';
  for (let i = 0; i <= S.path.length; i++) {
    const node = PL.get(S.path.slice(0, i));
    html += '<div class="col">' + PL.sorted(node).map((c) => {
      if (c.type === 'dir') {
        const on = S.path[i] === c.name ? ' on' : '';
        return `<button class="row${on}" data-dir="${i}" data-name="${PL.esc(c.name)}">${folder}<span class="name">${PL.esc(c.name)}</span><span class="n">${PL.count(c)}</span><span class="chev">›</span></button>`;
      }
      const on = i === S.path.length && S.sel === c.name ? ' on' : '';
      return `<button class="row${on}" data-proj="${i}" data-name="${PL.esc(c.name)}"><span class="dot" style="background:${PL.LANG[c.lang]}"></span><span class="name">${PL.esc(c.name)}</span></button>`;
    }).join('') + '</div>';
  }
  const node = PL.get(S.path);
  const p = (node.children || []).find((c) => c.type === 'project' && c.name === S.sel);
  html += p ? detail(p, S.path) : `<div class="empty">${PL.count(node)} progetti in ${PL.esc(S.path.at(-1) || 'Development')}</div>`;
  $('view').innerHTML = html;
}

function detail(p, path) {
  return `<section class="detail">
    <div class="path">~/Development/${PL.esc([...path, p.name].join('/'))}</div>
    <h1>${PL.esc(p.name)}</h1>
    <span class="tag"><span class="dot" style="background:${PL.LANG[p.lang]}"></span>${p.lang}</span>
    ${p.desc ? `<p>${PL.esc(p.desc)}</p>` : '<p class="none">Nessuna descrizione trovata nel README o nel manifest.</p>'}
    <div class="actions">
      ${PL.LAUNCHERS.map((l, i) => `<button class="act${i === 0 ? ' primary' : ''}" data-launch="${l.id}">${l.label}<kbd>${l.key}</kbd></button>`).join('')}
    </div>
  </section>`;
}

function resRow(e) {
  const where = e.path.join('/') || 'Development';
  return `<div class="res" data-goto="${PL.esc(e.path.join('/'))}" data-name="${PL.esc(e.project.name)}">
    <span class="dot" style="background:${PL.LANG[e.project.lang]}"></span>
    <div style="min-width:0"><div class="t">${PL.highlight(e.project.name, S.q)}</div><div class="s"><code>${PL.esc(where)}</code>${e.project.desc ? ' · ' + PL.highlight(e.project.desc, S.q) : ''}</div></div>
    <div class="mini">${PL.LAUNCHERS.map((l) => `<button data-launch="${l.id}">${l.short}</button>`).join('')}</div>
  </div>`;
}

function renderSearch() {
  const r = PL.search(S.q, S.global ? [] : S.path);
  let html = '<div class="results">';
  if (S.global) {
    html += `<h2>Ovunque in Development · ${r.here.length}</h2>` + r.here.map(resRow).join('');
  } else {
    html += `<h2>In ${PL.esc(S.path.join('/') || 'Development')} · ${r.here.length}</h2>`;
    html += r.here.length ? r.here.map(resRow).join('') : '<div class="s" style="padding:10px 12px;color:var(--mute)">Nessun risultato qui.</div>';
    if (S.path.length) {
      html += `<button class="global-row" data-global>${folder}<span>Cerca “${PL.esc(S.q)}” ovunque in Development</span>${r.elsewhere.length} altrove <kbd>Ctrl ↵</kbd></button>`;
    }
  }
  $('view').innerHTML = html + '</div>';
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button, .res');
  if (!t) return;
  if (t.dataset.up !== undefined) { S.path = S.path.slice(0, +t.dataset.up); S.sel = null; S.q = ''; $('q').value = ''; S.global = false; }
  else if (t.dataset.dir !== undefined) { S.path = [...S.path.slice(0, +t.dataset.dir), t.dataset.name]; S.sel = null; }
  else if (t.dataset.proj !== undefined) { S.path = S.path.slice(0, +t.dataset.proj); S.sel = t.dataset.name; }
  else if (t.dataset.global !== undefined) { S.global = true; }
  else if (t.dataset.launch) {
    const res = t.closest('.res');
    const name = res ? res.dataset.name : S.sel;
    PL.launch(t.dataset.launch, { name });
    return;
  } else if (t.classList.contains('res')) {
    S.path = t.dataset.goto ? t.dataset.goto.split('/') : []; S.sel = t.dataset.name; S.q = ''; $('q').value = ''; S.global = false;
  }
  render();
});

$('q').addEventListener('input', (e) => { S.q = e.target.value; render(); });
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Backspace' && !e.target.value) { if (S.global) S.global = false; else if (S.path.length) { S.path.pop(); S.sel = null; } render(); }
  if (e.key === 'Enter' && e.ctrlKey) { S.global = true; render(); }
  if (e.key === 'Escape') { e.target.value = ''; S.q = ''; S.global = false; render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
});
render();
</script>
</body>
</html>
