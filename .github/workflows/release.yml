# Build Windows (compilata da Linux, che costa la metà dei minuti) e release. Non parte a ogni push: solo quando si pubblica un tag v* (crea la release
# con l'installer allegato) o a mano da Actions → Release → Run workflow (installer come artefatto, niente release).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Wails su Windows non usa cgo: senza cgo si compila per Windows da Linux e si fa vet per gli altri sistemi
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versione del tag uguale a quella dell'app
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app=$(grep -E '^\s+version:\s*"' build/config.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::il tag è $GITHUB_REF_NAME ma build/config.yml dice $app"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: CLI di Wails (stessa versione di go.mod)
        run: |
          v=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$v"

      - name: Dipendenze, binding e frontend
        run: |
          (cd frontend && npm ci)
          GOOS=windows wails3 generate bindings -clean=true -ts -i
          # main.go incorpora frontend/dist: senza la build go vet non compila
          (cd frontend && npm run build)

      - name: Test Go
        run: |
          GOOS=windows go vet ./...
          # internal/core importa Wails, che fuori da Windows richiede cgo: qui si controlla e si prova il resto
          # (go test compila anche i pacchetti senza test). internal/core resta coperto dal vet per Windows.
          pkgs=$(go list ./internal/... | grep -v /internal/core)
          GOOS=darwin go vet $pkgs
          go vet $pkgs
          go test $pkgs

      - name: Controllo dei tipi
        working-directory: frontend
        run: npm run check -- --fail-on-warnings

      - name: Test e2e
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis

      - name: Installer
        env:
          GOOS: windows
        run: wails3 package GOOS=windows ARCH=amd64

      - name: Artefatto (avvio manuale)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: project-library-installer
          path: bin/project-library-amd64-installer.exe
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          {
            echo "## Novità"
            echo
            git log "$range" --no-merges --pretty='- %s' | grep -vE '^- chore: release' || true
          } > notes.md
          gh release create "$GITHUB_REF_NAME" bin/project-library-amd64-installer.exe \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
