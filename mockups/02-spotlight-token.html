<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 · Spotlight a token</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0d0e12; --panel: #17181d; --line: #2a2b33; --ink: #ecebf0; --mute: #8d8c99; --accent: #ff6b4a; --sel: #24252d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); background-image: radial-gradient(#ffffff10 1px, transparent 1px); background-size: 22px 22px; color: var(--ink); font: 15px/1.4 'Hanken Grotesk', system-ui, sans-serif; display: flex; justify-content: center; padding: 10vh 16px; }
  .panel { width: 760px; max-width: 100%; align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 40px 100px rgba(0,0,0,.6); overflow: hidden; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .tok { display: inline-flex; align-items: center; gap: 6px; background: #262731; border: 1px solid #353643; color: var(--ink); border-radius: 7px; padding: 4px 9px; font: 500 13px 'JetBrains Mono', monospace; }
  .tok.root { color: var(--mute); }
  .tok.glob { background: var(--accent); border-color: var(--accent); color: #1a0d09; font-weight: 600; }
  .bar input { flex: 1; min-width: 160px; background: transparent; border: 0; outline: none; color: var(--ink); font: inherit; font-size: 19px; padding: 4px 6px; }
  .list { max-height: 56vh; overflow-y: auto; padding: 8px; }
  .sec { font-size: 12px; color: var(--mute); padding: 10px 12px 6px; display: flex; justify-content: space-between; }
  .it { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
  .it.on { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
  .it .ic { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: none; font: 700 12px 'JetBrains Mono', monospace; color: #111; }
  .it .ic.dir { background: #2c2d37; color: var(--mute); }
  .it .m { flex: 1; min-width: 0; }
  .it .t { font-weight: 600; }
  .it .s { font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .r { font: 12px 'JetBrains Mono', monospace; color: var(--mute); }
  .it.glob .ic { background: transparent; border: 1px dashed var(--accent); color: var(--accent); }
  .it.glob .t { color: var(--accent); }
  .foot { display: flex; align-items: center; gap: 18px; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--mute); }
  .foot b { color: var(--ink); font-weight: 600; }
  .foot .sp { flex: 1; }
  kbd { font: 11px 'JetBrains Mono', monospace; color: var(--ink); background: #262731; border: 1px solid #353643; border-radius: 4px; padding: 1px 5px; margin-right: 4px; }
  mark { background: none; color: var(--accent); font-weight: 700; }
  .hint { color: var(--mute); font-size: 13px; text-align: center; margin-top: 18px; }
  .wrap { width: 760px; max-width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="bar" id="bar"></div>
    <div class="list" id="list" role="listbox" aria-label="Risultati"></div>
    <div class="foot" id="foot"></div>
  </div>
  <div class="hint">↑↓ per muoverti · ↵ entra/apre · ⌫ su input vuoto risale di una cartella · Ctrl ↵ cerca ovunque · Esc pulisce</div>
</div>

<script src="shared/data.js"></script>
<script>
const S = { path: ['github', 'jacopofilonzi'], q: '', global: false, idx: 0 };
let items = [];
const $ = (id) => document.getElementById(id);
const dirIco = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3z"/></svg>';
const ini = (n) => n.replace(/[^a-z0-9]/gi, '').slice(0, 2).toUpperCase();

function bar() {
  const toks = S.global
    ? '<span class="tok glob">ovunque</span>'
    : '<span class="tok root">~/Development</span>' + S.path.map((s) => `<span class="tok">${PL.esc(s)}</span>`).join('');
  $('bar').innerHTML = toks + `<label for="q" style="position:absolute;left:-9999px">Cerca</label><input id="q" autocomplete="off" placeholder="${S.global ? 'Cerca in tutto Development…' : 'Cerca qui o scegli una cartella…'}">`;
  const q = $('q'); q.value = S.q; q.focus();
  q.addEventListener('input', () => { S.q = q.value; S.idx = 0; list(); });
  q.addEventListener('keydown', onKey);
}

function list() {
  items = [];
  let html = '';
  if (!S.q) {
    const node = PL.get(S.path);
    html += `<div class="sec"><span>${PL.esc(S.path.at(-1) || 'Development')}</span><span>${PL.count(node)} progetti</span></div>`;
    for (const c of PL.sorted(node)) {
      if (c.type === 'dir') items.push({ kind: 'dir', name: c.name, html: `<div class="ic dir">${dirIco}</div><div class="m"><div class="t">${PL.esc(c.name)}</div><div class="s">${PL.count(c)} progetti</div></div><span class="r">›</span>` });
      else items.push({ kind: 'proj', name: c.name, path: S.path, html: projHtml(c, '') });
    }
    html += items.map(rowHtml).join('');
  } else {
    const r = PL.search(S.q, S.global ? [] : S.path);
    html += `<div class="sec"><span>${S.global ? 'Ovunque' : 'In ' + PL.esc(S.path.join('/') || 'Development')}</span><span>${r.here.length}</span></div>`;
    r.here.forEach((e) => items.push({ kind: 'proj', name: e.project.name, path: e.path, html: projHtml(e.project, S.global ? e.path.join('/') : PL.rel(e.path, S.path)) }));
    if (!S.global && S.path.length) {
      items.push({ kind: 'global', html: `<div class="ic">${dirIco}</div><div class="m"><div class="t">Cerca “${PL.esc(S.q)}” ovunque</div><div class="s">${r.elsewhere.length} risultati fuori da ${PL.esc(S.path.at(-1))}</div></div><span class="r"><kbd>Ctrl ↵</kbd></span>` });
    }
    html += items.map(rowHtml).join('');
    if (!r.here.length && S.global) html += '<div class="sec">Nessun risultato.</div>';
  }
  $('list').innerHTML = html;
  foot();
}

function projHtml(p, where) {
  return `<div class="ic" style="background:${PL.LANG[p.lang]}">${ini(p.name)}</div><div class="m"><div class="t">${PL.highlight(p.name, S.q)}</div><div class="s">${p.desc ? PL.highlight(p.desc, S.q) : 'Nessuna descrizione'}</div></div><span class="r">${PL.esc(where)}</span>`;
}
function rowHtml(it, i) {
  return `<div class="it${it.kind === 'global' ? ' glob' : ''}${i === S.idx ? ' on' : ''}" role="option" data-i="${i}">${it.html}</div>`;
}
function foot() {
  const it = items[S.idx];
  if (!it) { $('foot').innerHTML = ''; return; }
  if (it.kind === 'proj') $('foot').innerHTML = `<b>${PL.esc(it.name)}</b><span class="sp"></span>` + PL.LAUNCHERS.map((l) => `<span><kbd>${l.key}</kbd>${l.label}</span>`).join('');
  else if (it.kind === 'dir') $('foot').innerHTML = `<b>${PL.esc(it.name)}</b><span class="sp"></span><span><kbd>↵</kbd>Entra</span><span><kbd>Ctrl E</kbd>Esplora file</span>`;
  else $('foot').innerHTML = `<span class="sp"></span><span><kbd>↵</kbd>Allarga la ricerca a tutto Development</span>`;
}

function activate(i, launcher) {
  const it = items[i];
  if (!it) return;
  if (it.kind === 'dir') { S.path = [...S.path, it.name]; S.q = ''; S.idx = 0; bar(); list(); }
  else if (it.kind === 'global') { S.global = true; S.idx = 0; bar(); list(); }
  else PL.launch(launcher || 'vscode', { name: it.name });
}

function onKey(e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); S.idx = Math.min(items.length - 1, S.idx + 1); list(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); S.idx = Math.max(0, S.idx - 1); list(); }
  else if (e.key === 'Enter' && e.ctrlKey) { S.global = true; S.idx = 0; bar(); list(); }
  else if (e.key === 'Enter') activate(S.idx);
  else if (e.ctrlKey && e.key === '2') { e.preventDefault(); activate(S.idx, 'intellij'); }
  else if (e.ctrlKey && e.key.toLowerCase() === 'e') { e.preventDefault(); activate(S.idx, 'explorer'); }
  else if (e.key === 'Backspace' && !e.target.value) {
    if (S.global) S.global = false; else S.path.pop();
    S.idx = 0; bar(); list();
  } else if (e.key === 'Escape') { S.q = ''; S.global = false; S.idx = 0; bar(); list(); }
}

$('list').addEventListener('mousemove', (e) => { const r = e.target.closest('.it'); if (r && +r.dataset.i !== S.idx) { S.idx = +r.dataset.i; list(); } });
$('list').addEventListener('click', (e) => { const r = e.target.closest('.it'); if (r) activate(+r.dataset.i); });
bar(); list();
</script>
</body>
</html>
