<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07 · Split + README</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  :root { --side: #1f1d4d; --side2: #2a2862; --sideink: #e9e7ff; --sidemute: #a19ed6; --paper: #fff; --bg: #f2f2f7; --ink: #16152b; --mute: #67667d; --line: #e3e3ec; --accent: #ffcf3f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 'Schibsted Grotesk', system-ui, sans-serif; }
  .app { height: 100vh; display: grid; grid-template-columns: 360px minmax(0, 1fr); }
  aside { background: var(--side); color: var(--sideink); display: flex; flex-direction: column; min-height: 0; }
  .top { padding: 18px 18px 12px; }
  .crumbs { font: 12px 'Fragment Mono', monospace; color: var(--sidemute); display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 10px; }
  .crumbs a { color: var(--sidemute); cursor: pointer; text-decoration: none; }
  .crumbs a:hover { color: #fff; }
  .here { font-weight: 800; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .here button { background: var(--side2); border: 0; color: var(--sideink); width: 30px; height: 30px; border-radius: 8px; font: inherit; cursor: pointer; }
  .here button:disabled { opacity: .3; }
  .sbox { margin-top: 14px; background: var(--side2); border-radius: 10px; display: flex; align-items: center; padding: 0 6px 0 12px; }
  .sbox input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #fff; font: inherit; padding: 10px 0; }
  .sbox input::placeholder { color: var(--sidemute); }
  .sbox .sc { font: 11px 'Fragment Mono', monospace; background: var(--accent); color: var(--side); border-radius: 5px; padding: 2px 6px; white-space: nowrap; }
  .list { flex: 1; overflow-y: auto; padding: 6px 10px 16px; }
  .it { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
  .it:hover { background: var(--side2); }
  .it.on { background: var(--accent); color: var(--side); }
  .it.on .s { color: #4a4680; }
  .it .ic { width: 22px; text-align: center; color: var(--sidemute); flex: none; }
  .it.on .ic { color: var(--side); }
  .it .m { flex: 1; min-width: 0; }
  .it .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .s { font: 11px 'Fragment Mono', monospace; color: var(--sidemute); }
  .it.glob { border: 1px dashed var(--accent); color: var(--accent); margin-top: 10px; }
  .grp { font: 11px 'Fragment Mono', monospace; color: var(--sidemute); padding: 12px 10px 4px; text-transform: uppercase; letter-spacing: .08em; }
  main { overflow-y: auto; padding: 32px; }
  .doc { max-width: 820px; margin: 0 auto; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .band { height: 8px; }
  .hd { padding: 28px 34px 22px; border-bottom: 1px solid var(--line); display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .hd .m { flex: 1; min-width: 240px; }
  .hd .path { font: 12px 'Fragment Mono', monospace; color: var(--mute); }
  .hd h1 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; margin: 6px 0 0; word-break: break-word; }
  .launch { display: flex; gap: 8px; flex-wrap: wrap; }
  .launch button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 14px; font: 600 14px 'Schibsted Grotesk', sans-serif; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 104px; }
  .launch button small { font: 11px 'Fragment Mono', monospace; color: var(--mute); }
  .launch button.p { background: var(--side); color: #fff; border-color: var(--side); }
  .launch button.p small { color: var(--sidemute); }
  .launch button:hover { border-color: var(--side); }
  .md { padding: 26px 34px 34px; font-size: 15px; line-height: 1.7; }
  .md h2 { font-size: 20px; margin: 0 0 8px; }
  .md p { margin: 0 0 14px; color: #34334a; }
  .md .none { color: var(--mute); background: var(--bg); border-radius: 10px; padding: 16px; font-size: 14px; }
  .md .none a { color: var(--side); font-weight: 600; }
  .md pre { font: 13px 'Fragment Mono', monospace; background: var(--bg); padding: 14px 16px; border-radius: 10px; overflow-x: auto; }
  .facts { display: flex; gap: 22px; padding: 0 34px 28px; flex-wrap: wrap; font-size: 13px; color: var(--mute); }
  .facts b { color: var(--ink); font-weight: 600; }
  .dirview { max-width: 820px; margin: 0 auto; }
  .dirview h1 { font-size: 40px; font-weight: 800; letter-spacing: -.02em; margin: 10px 0 18px; }
  .dirview .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .dirview .c { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .dirview .c b { display: block; }
  .dirview .c span { color: var(--mute); font-size: 12px; }
  mark { background: var(--accent); color: var(--side); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="top">
      <div class="crumbs" id="crumbs"></div>
      <div class="here"><button id="up" aria-label="Cartella superiore">←</button><span id="here"></span></div>
      <div class="sbox"><label for="q" style="position:absolute;left:-9999px">Cerca</label><input id="q" placeholder="Cerca qui…" autocomplete="off"><span class="sc" id="sc"></span></div>
    </div>
    <div class="list" id="list" role="listbox" aria-label="Contenuto"></div>
  </aside>
  <main id="main"></main>
</div>

<script src="shared/data.js"></script>
<script>
const S = { path: ['github', 'jacopofilonzi'], q: '', global: false, idx: 0 };
const $ = (id) => document.getElementById(id);
let items = [];

function render() {
  const here = S.path.at(-1) || 'Development';
  $('crumbs').innerHTML = ['~', ...S.path.slice(0, -1)].map((s, i) => `<a data-up="${i}">${PL.esc(i === 0 ? '~/Development' : s)}</a>/`).join('');
  if (!S.path.length) $('crumbs').innerHTML = '&nbsp;';
  $('here').textContent = here;
  $('up').disabled = !S.path.length;
  $('sc').textContent = S.global ? 'ovunque' : 'qui';
  items = [];
  let html = '';
  if (!S.q && !S.global) {
    PL.sorted(PL.get(S.path)).forEach((c) => items.push(c.type === 'dir' ? { kind: 'dir', node: c } : { kind: 'proj', node: c, path: S.path }));
  } else {
    const r = PL.search(S.q, S.global ? [] : S.path);
    r.here.forEach((e) => items.push({ kind: 'proj', node: e.project, path: e.path, rel: (S.global ? e.path : e.path.slice(S.path.length)).join('/') }));
    if (!S.global && S.path.length) items.push({ kind: 'glob', n: r.elsewhere.length });
    html += `<div class="grp">${S.global ? 'ovunque' : 'in ' + PL.esc(here)} · ${r.here.length}</div>`;
  }
  S.idx = Math.min(S.idx, Math.max(0, items.length - 1));
  html += items.map((it, i) => {
    const on = i === S.idx ? ' on' : '';
    if (it.kind === 'glob') return `<div class="it glob${on}" data-i="${i}"><span class="ic">✱</span><div class="m"><div class="t">Cerca ovunque</div><div class="s">+${it.n} fuori da ${PL.esc(here)} · Ctrl ↵</div></div></div>`;
    if (it.kind === 'dir') return `<div class="it${on}" data-i="${i}"><span class="ic">▸</span><div class="m"><div class="t">${PL.esc(it.node.name)}</div><div class="s">${PL.count(it.node)} progetti</div></div></div>`;
    return `<div class="it${on}" data-i="${i}"><span class="ic" style="color:${PL.LANG[it.node.lang]}">●</span><div class="m"><div class="t">${PL.highlight(it.node.name, S.q)}</div>${it.rel ? `<div class="s">${PL.esc(it.rel)}</div>` : ''}</div></div>`;
  }).join('');
  $('list').innerHTML = html;
  detail();
}

function detail() {
  const it = items[S.idx];
  if (!it) { $('main').innerHTML = ''; return; }
  if (it.kind === 'glob') { $('main').innerHTML = `<div class="dirview"><h1>Cerca “${PL.esc(S.q)}” ovunque</h1><p>Premi ↵ per allargare la ricerca a tutto ~/Development: ${it.n} risultati in più.</p></div>`; return; }
  if (it.kind === 'dir') {
    $('main').innerHTML = `<div class="dirview"><div style="font:12px 'Fragment Mono',monospace;color:var(--mute)">cartella</div><h1>${PL.esc(it.node.name)}/</h1><div class="cards">${PL.sorted(it.node).map((c) => `<div class="c"><b>${PL.esc(c.name)}${c.type === 'dir' ? '/' : ''}</b><span>${c.type === 'dir' ? PL.count(c) + ' progetti' : c.lang}</span></div>`).join('')}</div><p style="color:var(--mute)">↵ per entrare</p></div>`;
    return;
  }
  const p = it.node;
  $('main').innerHTML = `<article class="doc">
    <div class="band" style="background:${PL.LANG[p.lang]}"></div>
    <div class="hd"><div class="m"><div class="path">~/Development/${PL.esc([...it.path, p.name].join('/'))}</div><h1>${PL.esc(p.name)}</h1></div>
      <div class="launch">${PL.LAUNCHERS.map((l, i) => `<button class="${i === 0 ? 'p' : ''}" data-launch="${l.id}">${l.label}<small>${l.key}</small></button>`).join('')}</div></div>
    <div class="md">${p.desc
      ? `<h2>${PL.esc(p.name)}</h2><p>${PL.esc(p.desc)}</p><pre>README.md · anteprima dei primi paragrafi</pre>`
      : `<div class="none">Nessun README o descrizione trovati. <a href="#" onclick="return false">Aggiungi una descrizione</a> (salvata solo nella config dell'app).</div>`}</div>
    <div class="facts"><span>tipo <b>${p.lang}</b></span><span>sorgente <b>${PL.esc(it.path[0] || '—')}</b></span><span>gruppo <b>${PL.esc(it.path.slice(1).join('/') || '—')}</b></span></div>
  </article>`;
}

function activate(launcher) {
  const it = items[S.idx];
  if (!it) return;
  if (it.kind === 'dir') { S.path.push(it.node.name); S.idx = 0; S.q = ''; $('q').value = ''; render(); }
  else if (it.kind === 'glob') { S.global = true; S.idx = 0; render(); }
  else PL.launch(launcher || 'vscode', it.node);
}

$('list').addEventListener('click', (e) => { const r = e.target.closest('.it'); if (!r) return; if (+r.dataset.i === S.idx) activate(); else { S.idx = +r.dataset.i; render(); } });
document.addEventListener('click', (e) => {
  const l = e.target.closest('[data-launch]'); if (l) return activate(l.dataset.launch);
  const up = e.target.closest('[data-up]'); if (up) { S.path = S.path.slice(0, +up.dataset.up); S.idx = 0; S.q = ''; $('q').value = ''; S.global = false; render(); }
});
$('up').onclick = () => { S.path.pop(); S.idx = 0; S.global = false; render(); };
$('q').addEventListener('input', (e) => { S.q = e.target.value; S.idx = 0; render(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); S.idx = Math.min(items.length - 1, S.idx + 1); render(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); S.idx = Math.max(0, S.idx - 1); render(); }
  else if (e.key === 'Enter' && e.ctrlKey) { S.global = true; S.idx = 0; render(); }
  else if (e.key === 'Enter') activate();
  else if (e.ctrlKey && e.key === '2') { e.preventDefault(); activate('intellij'); }
  else if (e.ctrlKey && e.key.toLowerCase() === 'e') { e.preventDefault(); activate('explorer'); }
  else if (e.key === 'Backspace' && !$('q').value) { e.preventDefault(); if (S.global) S.global = false; else S.path.pop(); S.idx = 0; render(); }
  else if (e.key === 'Escape') { $('q').value = ''; S.q = ''; S.global = false; render(); }
  else if (e.key.length === 1 && !e.ctrlKey && document.activeElement !== $('q')) $('q').focus();
});
render();
</script>
</body>
</html>
