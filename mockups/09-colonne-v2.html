<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09 · Colonne v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f1; --panel: #fff; --card: #fff; --line: #e4e4de; --ink: #17171a; --mute: #6b6b70;
    --text2: #3c3c40; --faint: #b5b5b0; --hover: #ebebe6; --on-ink: #fff; --ink-hover: #2c2c33; --ink-sep: #3a3a40;
    --glass: rgba(255,255,255,.88); --danger-soft: #fdecea;
    --accent: #2347ff; --accent-soft: #e8ecff; --ok: #1f7a3d; --ok-soft: #e3f4e8; --warn: #9a5b00; --warn-soft: #fff1d6;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121214; --panel: #19191d; --card: #212126; --line: #2d2d34; --ink: #ececf0; --mute: #9b9ba5;
    --text2: #c9c9d0; --faint: #54545c; --hover: #25252b; --on-ink: #17171a; --ink-hover: #d4d4da; --ink-sep: #b4b4bc;
    --glass: rgba(30,30,36,.86); --danger-soft: #3b1714;
    --accent: #6d87ff; --accent-soft: #232a4d; --ok: #62d28e; --ok-soft: #15301f; --warn: #f2b65c; --warn-soft: #3a2a12;
  }
  body, header, .col, .detail, .git, .readme, .dlg, .ctx, .menu { transition: background-color .15s, border-color .15s; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  /* simula la MinWidth della finestra Wails: 2 colonne (2 × 220) + scheda progetto (480) */
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 Geist, system-ui, sans-serif; min-width: 920px; }
  .app { height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .logo { font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
  .logo span { color: var(--accent); }
  .crumbs { display: flex; gap: 2px; align-items: center; font-family: 'Geist Mono', monospace; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; }
  .crumbs button { background: none; border: 0; font: inherit; color: var(--mute); padding: 4px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .crumbs button:hover { background: var(--bg); color: var(--ink); }
  .crumbs button:last-child { color: var(--ink); font-weight: 500; }
  .crumbs i { color: var(--faint); font-style: normal; }
  .search { display: flex; align-items: center; gap: 6px; width: 340px; flex: none; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 4px 4px 10px; }
  .search:focus-within { border-color: var(--accent); background: var(--card); }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; border-radius: 5px; padding: 3px 4px 3px 8px; white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .chip.global { background: var(--ink); color: var(--on-ink); padding-right: 8px; }
  .chip button { background: none; border: 0; color: inherit; cursor: pointer; font: inherit; padding: 0 3px; }
  .search input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; outline: none; padding: 6px 0; }
  kbd { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--mute); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; background: var(--card); }

  /* "Apri con" split button */
  .open { position: relative; display: flex; flex: none; }
  .open .main { display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--on-ink); border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .open.split .main { border-radius: 8px 0 0 8px; }
  .open .caret { background: var(--ink); color: var(--on-ink); border: 0; border-left: 1px solid var(--ink-sep); border-radius: 0 8px 8px 0; padding: 0 10px; cursor: pointer; font: inherit; }
  .open .main:hover, .open .caret:hover { background: var(--ink-hover); }
  .open .main:disabled, .open .main:disabled + .caret { background: var(--line); cursor: not-allowed; }
  .open .main kbd { background: transparent; color: var(--on-ink); opacity: .6; border-color: var(--ink-sep); }
  .menu { position: absolute; top: calc(100% + 6px); right: 0; min-width: 260px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.14); padding: 6px; z-index: 10; }
  .menu[hidden] { display: none; }
  .menu .h { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; padding: 6px 10px 4px; }
  .menu button { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; font: inherit; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .menu button:hover { background: var(--bg); }
  .menu button span { flex: 1; }
  .menu button small { color: var(--mute); font-size: 11px; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
  .ibtn { width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; color: var(--ink); }
  .ibtn:hover { border-color: var(--ink); }
  .lico { width: 18px; height: 18px; border-radius: 4px; flex: none; display: inline-flex; align-items: center; justify-content: center; font: 700 9px 'Geist Mono', monospace; color: #fff; }
  img.lico { border-radius: 0; object-fit: contain; }

  main { flex: 1; min-height: 0; display: flex; overflow: hidden; }
  .cols { display: flex; flex: none; }
  .hidden-cols { width: 28px; flex: none; border-right: 1px solid var(--line); background: var(--bg); display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; cursor: pointer; color: var(--mute); font: 12px 'Geist Mono', monospace; writing-mode: vertical-rl; border-top: 0; border-bottom: 0; border-left: 0; }
  .hidden-cols:hover { color: var(--ink); background: var(--hover); }
  .col { width: 220px; flex: none; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 6px; }
  .row { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; font: inherit; color: inherit; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .row:hover { background: var(--bg); }
  .row.on { background: var(--accent); color: #fff; }
  .row.on .n, .row.on .chev { color: rgba(255,255,255,.8); }
  .row .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .n { font-size: 12px; color: var(--mute); font-family: 'Geist Mono', monospace; }
  .row .chev { color: var(--faint); }
  .row .gd { width: 6px; height: 6px; border-radius: 50%; background: #e0a100; flex: none; }
  .ico { width: 16px; height: 16px; flex: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; margin: 0 3px; }

  .detail { flex: 1; min-width: 480px; overflow-y: auto; }
  .detail .in { max-width: 900px; margin: 0 auto; padding: 28px 36px 60px; display: flex; flex-direction: column; gap: 16px; }
  .detail .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .detail .head > div:first-child { min-width: 0; flex: 1 1 260px; }
  .detail .acts { display: flex; gap: 8px; align-items: center; }
  .detail .path { font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--mute); word-break: break-all; }
  .detail h1 { margin: 0; font-size: 34px; letter-spacing: -.03em; line-height: 1.05; word-break: break-word; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mute); }
  .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--mute); }

  .git { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .git .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 4px 10px; background: var(--bg); color: var(--ink); white-space: nowrap; }
  .pill.mono { font-family: 'Geist Mono', monospace; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill a { color: inherit; }
  .git .remote { margin-left: auto; font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--accent); text-decoration: none; }
  .git .remote:hover { text-decoration: underline; }
  .git .remote.none { color: var(--mute); }
  .git .commit { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; font-size: 13px; }
  .git .commit code { font-family: 'Geist Mono', monospace; color: var(--accent); }
  .git .commit .msg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .git .commit .who { color: var(--mute); white-space: nowrap; }
  .nogit { font-size: 13px; color: var(--mute); display: flex; align-items: center; gap: 8px; }

  .readme { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .readme .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--mute); font-family: 'Geist Mono', monospace; }
  .readme .bar span { flex: 1; }
  .md { padding: 8px 28px 24px; font-size: 15px; line-height: 1.65; overflow-wrap: anywhere; }
  .md h1 { font-size: 26px; margin: 18px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .md h2 { font-size: 20px; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .md h3 { font-size: 16px; margin: 18px 0 6px; }
  .md p, .md ul, .md ol { margin: 0 0 12px; }
  .md a { color: var(--accent); }
  .md code { font-family: 'Geist Mono', monospace; font-size: 13px; background: var(--bg); border-radius: 4px; padding: 1px 5px; }
  .md pre { background: #17171a; color: #e7e7ea; border-radius: 8px; padding: 14px 16px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; color: inherit; font-size: 12.5px; }
  .md table { border-collapse: collapse; margin: 0 0 14px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .md th { background: var(--bg); }
  .md blockquote { margin: 0 0 12px; padding: 4px 14px; border-left: 3px solid var(--line); color: var(--mute); }
  .md img { max-width: 100%; }
  .placeholder { padding: 28px; color: var(--mute); text-align: center; }

  .results { flex: 1; overflow-y: auto; padding: 18px 20px; background: var(--panel); }
  .results h2 { font-size: 12px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; margin: 6px 0 8px; }
  .res { display: grid; grid-template-columns: 14px minmax(0, 1fr); align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .res:hover { background: var(--bg); }
  .res .t { font-weight: 600; }
  .res .s { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .s code { font-family: 'Geist Mono', monospace; }
  .global-row { display: flex; align-items: center; gap: 12px; width: 100%; margin: 14px 0; padding: 12px 14px; background: var(--accent-soft); color: var(--accent); border: 1px dashed var(--accent); border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; text-align: left; }
  .global-row span { flex: 1; }
  mark { background: #ffe58a; color: #17171a; border-radius: 2px; }

  .search-btn { display: flex; align-items: center; gap: 8px; width: 240px; flex: none; height: 36px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 0 6px 0 10px; font: inherit; color: var(--mute); cursor: pointer; }
  .search-btn span { flex: 1; text-align: left; }
  .search-btn:hover { border-color: var(--faint); color: var(--ink); }

  /* palette di ricerca flottante (stile Spotlight) */
  .pal-bg { position: fixed; inset: 0; background: rgba(23,23,26,.18); backdrop-filter: blur(2px); z-index: 60; display: flex; justify-content: center; align-items: flex-start; padding: 16vh 16px 16px; }
  .pal { width: 680px; max-width: 100%; background: var(--glass); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border: 1px solid rgba(0,0,0,.08); border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.08); overflow: hidden; }
  .pal .in { display: flex; align-items: center; gap: 10px; padding: 14px 18px; }
  .pal .in svg { color: var(--mute); flex: none; }
  .pal .in input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: 400 22px Geist, sans-serif; color: var(--ink); }
  .pal .in .chip { max-width: 200px; }
  .pal .lst { border-top: 1px solid rgba(0,0,0,.07); max-height: 52vh; overflow-y: auto; padding: 6px; }
  .pal .sec { font-size: 11px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; padding: 8px 12px 4px; }
  .pal .it { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 9px; cursor: pointer; }
  .pal .it.on { background: var(--accent); color: #fff; }
  .pal .it .m { flex: 1; min-width: 0; }
  .pal .it .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pal .it .s { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pal .it.on .s { color: rgba(255,255,255,.8); }
  .pal .it .w { font: 12px 'Geist Mono', monospace; color: var(--mute); white-space: nowrap; }
  .pal .it.on .w { color: rgba(255,255,255,.85); }
  .pal .it.on mark { background: rgba(255,255,255,.3); color: #fff; }
  .pal .it.glob { color: var(--accent); }
  .pal .it.glob.on { color: #fff; }
  .pal .ib { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: none; font: 700 11px 'Geist Mono', monospace; color: #fff; }
  .pal .none { padding: 18px 12px; color: var(--mute); text-align: center; }
  .pal .ft { display: flex; gap: 16px; padding: 9px 16px; border-top: 1px solid rgba(0,0,0,.07); font-size: 12px; color: var(--mute); }
  .pal .ft .sp { flex: 1; }

  .tbtn { display: flex; align-items: center; gap: 6px; height: 36px; flex: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; font: inherit; font-weight: 600; cursor: pointer; color: var(--ink); }
  .tbtn:hover { border-color: var(--ink); }

  /* intestazione colonna + azioni riga */
  .col { padding-top: 0; }
  .colhead { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 6px; background: var(--panel); margin: 0 -6px 4px; padding: 8px 8px 6px 16px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--mute); }
  .colhead span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .colhead button { width: 26px; height: 26px; border: 0; background: none; border-radius: 6px; cursor: pointer; color: var(--mute); font: 600 16px/1 Geist, sans-serif; }
  .colhead button:hover { background: var(--bg); color: var(--ink); }
  .row .more { visibility: hidden; width: 22px; height: 22px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; color: var(--mute); flex: none; margin-left: -4px; }
  .row:hover .more, .row.on .more { visibility: visible; }
  .row .more:hover { background: rgba(0,0,0,.08); color: var(--ink); }
  .row.on .more { color: rgba(255,255,255,.8); }
  .row.on .more:hover { background: rgba(255,255,255,.18); color: #fff; }
  .emptybox { background: var(--panel); border: 1px dashed var(--faint); border-radius: 12px; padding: 22px 24px; color: var(--text2); }
  .emptybox p { margin: 0 0 14px; max-width: 560px; }
  .emptyacts { display: flex; gap: 8px; flex-wrap: wrap; }
  .colempty { padding: 14px 10px; color: var(--mute); font-size: 13px; }
  .colempty button { display: block; margin-top: 8px; background: none; border: 1px dashed var(--line); border-radius: 6px; padding: 7px 10px; font: inherit; color: var(--ink); cursor: pointer; width: 100%; text-align: left; }

  .ctx { position: fixed; min-width: 220px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.16); padding: 6px; z-index: 40; }
  .ctx button { width: 100%; display: flex; gap: 10px; background: none; border: 0; font: inherit; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .ctx button span { flex: 1; }
  .ctx button small { color: var(--mute); font-size: 11px; }
  .ctx button:hover { background: var(--bg); }
  .ctx button.danger { color: #c4291c; }
  .ctx button.danger:hover { background: var(--danger-soft); }
  .ctx hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

  /* dialog */
  .backdrop { position: fixed; inset: 0; background: rgba(23,23,26,.35); display: flex; align-items: flex-start; justify-content: center; padding: 12vh 16px; z-index: 50; }
  .dlg { width: 480px; max-width: 100%; background: var(--card); border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.25); overflow: hidden; }
  .dlg h3 { margin: 0; padding: 18px 20px 4px; font-size: 17px; }
  .dlg .bd { padding: 8px 20px 4px; display: flex; flex-direction: column; gap: 12px; color: var(--text2); }
  .dlg .bd p { margin: 0; }
  .dlg label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--mute); }
  .dlg input[type=text] { font: 14px Geist, sans-serif; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; outline: none; }
  .dlg input[type=text]:focus { border-color: var(--accent); }
  .dlg .pre { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .dlg .pre:focus-within { border-color: var(--accent); }
  .dlg .pre span { font: 13px 'Geist Mono', monospace; color: var(--mute); background: var(--bg); padding: 9px 4px 9px 10px; white-space: nowrap; }
  .dlg .pre input { border: 0 !important; flex: 1; min-width: 0; border-radius: 0; font-family: 'Geist Mono', monospace !important; font-size: 13px !important; }
  .dlg .hint { font-size: 12px; font-weight: 400; color: var(--mute); }
  .dlg .hint.err { color: #c4291c; }
  .dlg .hint.sug { color: var(--accent); }
  .dlg .hint.sug button { background: none; border: 0; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
  .dlg .chk { flex-direction: row; align-items: center; font-weight: 500; color: var(--ink); font-size: 13px; }
  .dlg .warn { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .dlg .final { font: 12px 'Geist Mono', monospace; background: var(--bg); border-radius: 8px; padding: 9px 11px; word-break: break-all; }
  .dlg .prog { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .dlg .prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .dlg .ft { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 20px; }
  .dlg .ft button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .dlg .ft button.p { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .dlg .ft button.d { background: #c4291c; color: #fff; border-color: #c4291c; }
  .dlg .ft button:disabled { opacity: .45; cursor: not-allowed; }

  /* pannello finto per simulare la config dei launcher: non fa parte della UI */
  .hgroup { display: flex; gap: 6px; }

  /* impostazioni: pannello modale nella stessa finestra, dimensione fissa */
  .set-bg { position: fixed; inset: 0; background: rgba(10,10,12,.4); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .set { width: 880px; height: 600px; max-width: 100%; max-height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 40px 100px rgba(0,0,0,.35); display: grid; grid-template-columns: 210px minmax(0, 1fr); overflow: hidden; }
  .set nav { background: var(--bg); border-right: 1px solid var(--line); padding: 18px 10px; display: flex; flex-direction: column; gap: 2px; }
  .set nav h2 { font-size: 15px; margin: 0 10px 14px; }
  .set nav button { display: flex; align-items: center; gap: 10px; background: none; border: 0; font: inherit; color: var(--text2); text-align: left; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
  .set nav button:hover { background: var(--hover); }
  .set nav button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
  .set nav .sp { flex: 1; }
  .set nav .ver { font-size: 11px; color: var(--mute); padding: 0 10px; }
  .set .pane { display: flex; flex-direction: column; min-height: 0; }
  .set .ph { display: flex; align-items: center; padding: 18px 24px 14px; border-bottom: 1px solid var(--line); }
  .set .ph h3 { margin: 0; font-size: 18px; flex: 1; }
  .set .ph small { color: var(--mute); margin-right: 12px; }
  .set .x { width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; color: var(--mute); font-size: 18px; cursor: pointer; }
  .set .x:hover { background: var(--hover); color: var(--ink); }
  .set .pb { flex: 1; overflow-y: auto; padding: 8px 24px 24px; }
  .set .grp { font-size: 11px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 6px; }
  .set .f { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .set .f:last-child { border-bottom: 0; }
  .set .f .l { flex: 1; min-width: 0; }
  .set .f .l b { display: block; font-weight: 500; }
  .set .f .l span { font-size: 12px; color: var(--mute); }
  .set input[type=text], .set input[type=number] { font: 13px 'Geist Mono', monospace; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; outline: none; }
  .set input:focus { border-color: var(--accent); }
  .set .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 7px; padding: 7px 12px; font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .set .btn:hover { border-color: var(--faint); }
  .set .btn.p { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .set .btn.d { color: #d2412f; }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; font: inherit; font-size: 13px; color: var(--mute); padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .sw { position: relative; width: 36px; height: 20px; flex: none; appearance: none; background: var(--faint); border-radius: 999px; cursor: pointer; transition: background .15s; margin: 0; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw:checked { background: var(--accent); }
  .sw:checked::after { transform: translateX(16px); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { display: inline-flex; align-items: center; gap: 4px; font: 12px 'Geist Mono', monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px 3px 8px; }
  .chips span button { border: 0; background: none; color: var(--mute); cursor: pointer; padding: 0 3px; font: inherit; }
  .chips input { width: 140px; padding: 3px 8px !important; }
  .roots .r { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); margin-bottom: 6px; font: 13px 'Geist Mono', monospace; }
  .roots .r span { flex: 1; }
  .ln { border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin-bottom: 8px; }
  .ln .top { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
  .ln .grip { color: var(--faint); cursor: grab; letter-spacing: -2px; }
  .ln .lico { width: 22px; height: 22px; }
  .ln .nm { flex: 1; min-width: 0; }
  .ln .nm b { font-weight: 600; }
  .ln .nm code { display: block; font: 12px 'Geist Mono', monospace; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ln .def { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--mute); }
  .ln .tag { font-size: 11px; color: var(--mute); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .ln .edit { border-top: 1px solid var(--line); padding: 12px; display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px 12px; align-items: center; font-size: 13px; }
  .ln .edit label { color: var(--mute); }
  .ln .edit .row2 { display: flex; gap: 6px; }
  .ln .edit .row2 input { flex: 1; min-width: 0; }
  .ln .edit .ph2 { grid-column: 2; font-size: 12px; color: var(--mute); }
  .ln .edit .ph2 code { font-family: 'Geist Mono', monospace; background: var(--bg); border-radius: 4px; padding: 0 4px; }
  .ln .edit .acts2 { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; }
  .note { font-size: 12px; color: var(--mute); background: var(--bg); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .keys { width: 100%; border-collapse: collapse; font-size: 13px; }
  .keys td { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .keys td:last-child { text-align: right; }
  .ovr { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ovr td { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .ovr td:first-child { font-family: 'Geist Mono', monospace; font-size: 12px; }
  .ovr td:last-child { text-align: right; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">project<span>/</span>library</div>
    <nav class="crumbs" id="crumbs" aria-label="Percorso"></nav>
    <button class="search-btn" id="search-btn" title="Cerca (Ctrl K / ⌘K)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Cerca</span><kbd id="kbd-k">Ctrl K</kbd>
    </button>
    <button class="tbtn" id="clone-btn" title="Clona una repository">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>Clona
    </button>
    <div class="hgroup">
      <button class="ibtn" id="theme-btn" aria-label="Tema chiaro/scuro"></button>
      <button class="ibtn" id="settings-btn" title="Impostazioni (Ctrl P)" aria-label="Impostazioni">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
</div>

<div id="settings"></div>
<div id="ctx"></div>
<div id="modal"></div>
<div id="palette"></div>

<script src="shared/data.js"></script>
<script src="shared/git.js"></script>
<script>
// Launcher configurati (in futuro da config.json). Esplora file è un'azione a parte, sempre disponibile.
const LAUNCHERS = [
  // loghi ufficiali dal set Devicon (nell'app andranno inclusi come asset locali)
  { id: 'vscode', label: 'VS Code', color: '#0a7acc', abbr: 'VS', icon: 'https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/vscode/vscode-original.svg', enabled: true },
  { id: 'intellij', label: 'IntelliJ IDEA', color: '#e8336d', abbr: 'IJ', icon: 'https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/intellij/intellij-original.svg', enabled: true },
  { id: 'wt', label: 'Windows Terminal', color: '#3a3a40', abbr: '>_', enabled: true, custom: true },
];
let defaultId = 'vscode';

// Progetti aperti con "Apri con", dal più recente (nell'app: salvati in config, max 20).
// Valori iniziali di esempio per il mockup.
const H = 3600e3, D = 24 * H;
const RECENT = [
  { path: ['github', 'jacopofilonzi'], name: 'TimeTable', launcher: 'vscode', at: Date.now() - 2 * H },
  { path: ['local'], name: 'awake', launcher: 'vscode', at: Date.now() - 1 * D },
  { path: ['local', 'UNI', 'Ingegneria del Software'], name: 'BuildPatternDemo', launcher: 'intellij', at: Date.now() - 3 * D },
  { path: ['github', 'jacopofilonzi'], name: 'ovh-vps-stocknotifier', launcher: 'vscode', at: Date.now() - 4 * D },
  { path: ['github', 'curishi'], name: 'play.evons.gg', launcher: 'vscode', at: Date.now() - 8 * D },
  { path: ['github', 'jacopofilonzi'], name: 'deploy', launcher: 'wt', at: Date.now() - 15 * D },
];
function recordOpen(path, name, launcher) {
  const i = RECENT.findIndex((r) => r.name === name && r.path.join('/') === path.join('/'));
  if (i >= 0) RECENT.splice(i, 1);
  RECENT.unshift({ path: [...path], name, launcher, at: Date.now() });
  RECENT.length = Math.min(RECENT.length, 20);
}
// Solo le voci ancora esistenti (un progetto può essere stato eliminato o spostato).
function recentEntries() {
  return RECENT.map((r) => {
    let node = PL.TREE;
    for (const s of r.path) { node = node && (node.children || []).find((c) => c.type === 'dir' && c.name === s); }
    const project = node && node.children.find((c) => c.name === r.name);
    return project ? { project, path: r.path, launcher: r.launcher, at: r.at } : null;
  }).filter(Boolean);
}
function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'adesso';
  if (s < 3600) return Math.floor(s / 60) + ' min fa';
  if (s < 86400) return Math.floor(s / 3600) + ' h fa';
  const d = Math.floor(s / 86400);
  return d === 1 ? 'ieri' : d < 7 ? d + ' giorni fa' : Math.floor(d / 7) + ' sett. fa';
}

const S = { path: ['github', 'jacopofilonzi'], sel: 'TimeTable', q: '', global: false, menu: false };
const $ = (id) => document.getElementById(id);
const folder = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3z"/></svg>';
const branchIco = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-12 7"/></svg>';
const key = (path, name) => [...path, name].join('/');
const enabled = () => LAUNCHERS.filter((l) => l.enabled);
// Logo vero se disponibile, altrimenti un quadratino colorato con le iniziali (launcher custom).
const lico = (l) => l.icon
  ? `<img class="lico" src="${l.icon}" alt="" onerror="this.outerHTML='<span class=&quot;lico&quot; style=&quot;background:${l.color}&quot;>${PL.esc(l.abbr)}</span>'">`
  : `<span class="lico" style="background:${l.color}">${PL.esc(l.abbr)}</span>`;
const readmeCache = new Map();

function selected() {
  if (!S.sel) return null;
  const p = (PL.get(S.path).children || []).find((c) => c.type === 'project' && c.name === S.sel);
  return p ? { project: p, path: S.path } : null;
}

// Cosa aprono i launcher: il progetto selezionato oppure, se la cartella corrente è vuota,
// la cartella stessa (progetto locale non ancora inizializzato).
function target() {
  const sel = selected();
  if (sel) return { name: sel.project.name, parent: sel.path, path: key(sel.path, sel.project.name) };
  const node = PL.get(S.path);
  if (S.path.length && !node.children.length) return { name: node.name, parent: S.path.slice(0, -1), path: S.path.join('/') };
  return null;
}

// ---------- header ----------
function renderHeader() {
  const segs = ['Development', ...S.path];
  $('crumbs').innerHTML = segs.map((s, i) => `<button data-up="${i}">${PL.esc(s)}</button>`).join('<i>/</i>');
  renderOpen();
}

function renderOpen() {
  if (!$('open')) return; // vive nella scheda progetto (o nella scheda "cartella vuota")
  const ls = enabled();
  const sel = target();
  if (!ls.length) {
    $('open').className = 'open';
    $('open').innerHTML = `<button class="main" data-settings>Configura un launcher</button>`;
    return;
  }
  const def = ls.find((l) => l.id === defaultId) || ls[0];
  const others = ls.filter((l) => l !== def);
  const dis = sel ? '' : ' disabled title="Seleziona un progetto"';
  $('open').className = 'open' + (others.length ? ' split' : '');
  $('open').innerHTML =
    `<button class="main" data-launch="${def.id}"${dis}>${lico(def)}Apri con ${PL.esc(def.label)} <kbd>↵</kbd></button>` +
    (others.length ? `<button class="caret" data-caret aria-label="Altri launcher" aria-expanded="${S.menu}"${sel ? '' : ' disabled'}>▾</button>
      <div class="menu" ${S.menu ? '' : 'hidden'} role="menu">
        <div class="h">Apri ${sel ? PL.esc(sel.name) : ''} con</div>
        ${others.map((l) => `<button role="menuitem" data-launch="${l.id}">${lico(l)}<span>${PL.esc(l.label)}</span><small>Ctrl ${ls.indexOf(l) + 1}</small></button>`).join('')}
        <hr>
        <button role="menuitem" data-settings><span>Configura launcher…</span></button>
      </div>` : '');
}

// ---------- vista cartelle ----------
function render() {
  renderHeader();
  renderColumns();
}

// Quante colonne stanno accanto alla scheda progetto (min 480px); sempre almeno 2.
function fitCols() {
  return Math.max(2, Math.floor((window.innerWidth - 480 - 28) / 220));
}

function renderColumns() {
  let cols = '';
  const start = Math.max(0, S.path.length + 1 - fitCols());
  if (start > 0) cols += `<button class="hidden-cols" data-up="${start - 1}" title="Torna a ${PL.esc(['Development', ...S.path][start - 1])}">‹ ${start} ${start === 1 ? 'livello' : 'livelli'}</button>`;
  for (let i = start; i <= S.path.length; i++) {
    const node = PL.get(S.path.slice(0, i));
    const more = (kind, name) => `<span class="more" data-more="${i}" data-kind="${kind}" data-name="${PL.esc(name)}" title="Azioni">⋯</span>`;
    const kids = PL.sorted(node);
    cols += `<div class="col"><div class="colhead"><span>${PL.esc(['Development', ...S.path][i])}</span><button data-add="${i}" title="Nuova cartella o clona qui" aria-label="Aggiungi in ${PL.esc(['Development', ...S.path][i])}">+</button></div>` + kids.map((c) => {
      if (c.type === 'dir') {
        const on = S.path[i] === c.name ? ' on' : '';
        return `<button class="row${on}" data-dir="${i}" data-name="${PL.esc(c.name)}">${folder}<span class="name">${PL.esc(c.name)}</span><span class="n">${PL.count(c)}</span>${more('dir', c.name)}<span class="chev">›</span></button>`;
      }
      const on = i === S.path.length && S.sel === c.name ? ' on' : '';
      const g = GIT[key(S.path.slice(0, i), c.name)];
      return `<button class="row${on}" data-proj="${i}" data-name="${PL.esc(c.name)}"><span class="dot" style="background:${PL.LANG[c.lang]}"></span><span class="name">${PL.esc(c.name)}</span>${g && g.dirty ? '<span class="gd" title="Modifiche non committate"></span>' : ''}${more('proj', c.name)}</button>`;
    }).join('') + (kids.length ? '' : `<div class="colempty">Cartella vuota.<button data-newdir="${i}">+ Nuova cartella</button><button data-clonehere="${i}">↓ Clona una repository qui</button></div>`) + '</div>';
  }
  const sel = selected();
  const node = PL.get(S.path);
  const emptyHere = S.path.length && !node.children.length;
  $('view').innerHTML = `<div class="cols">${cols}</div>` + (sel
    ? `<section class="detail" id="detail">${detail(sel.project, sel.path)}</section>`
    : emptyHere ? `<section class="detail">${emptyCard()}</section>`
    : `<div class="empty">${PL.count(node) ? `${PL.count(node)} progetti in ${PL.esc(S.path.at(-1) || 'Development')}` : 'Nessun progetto qui'}</div>`);
  if (sel) { renderOpen(); loadReadme(key(sel.path, sel.project.name)); }
  if (emptyHere) renderOpen();
}

// Scheda per una cartella vuota: può diventare un gruppo (nuova cartella, clona)
// oppure essere già un progetto locale non ancora inizializzato (apri con).
function emptyCard() {
  const here = S.path.at(-1);
  return `<div class="in">
    <div class="head">
      <div>
        <div class="path">~/Development/${PL.esc(S.path.join('/'))}</div>
        <h1>${PL.esc(here)}</h1>
        <span class="tag">${folder} Cartella vuota</span>
      </div>
      <div class="acts">
        <div class="open" id="open"></div>
        <button class="ibtn" id="explorer" title="Mostra in Esplora file (Ctrl E)" aria-label="Mostra in Esplora file">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3z"/></svg>
        </button>
      </div>
    </div>
    <div class="emptybox">
      <p>Non c'è ancora niente qui. Puoi iniziare un progetto aprendo la cartella nell'editor, oppure usarla per raggruppare altri progetti.</p>
      <div class="emptyacts">
        <button class="tbtn" data-newdir="${S.path.length}">+ Nuova cartella</button>
        <button class="tbtn" data-clonehere="${S.path.length}">↓ Clona una repository qui</button>
        <button class="tbtn" data-markproj>Segna come progetto</button>
      </div>
    </div>
  </div>`;
}

function remoteUrl(r) {
  const m = r.match(/^git@([^:]+):(.+?)(\.git)?$/);
  const url = m ? `https://${m[1]}/${m[2]}` : r.replace(/\.git$/, '');
  return { url, label: url.replace(/^https?:\/\//, '') };
}

function gitBlock(k) {
  const g = GIT[k];
  if (!g) return `<div class="nogit">${branchIco} Non è un repository git</div>`;
  const pills = [`<span class="pill mono">${branchIco}${PL.esc(g.branch)}</span>`];
  pills.push(g.dirty ? `<span class="pill warn">${g.dirty} file modificati</span>` : `<span class="pill ok">Nessuna modifica</span>`);
  if (g.remote && g.behind !== null) {
    if (g.ahead) pills.push(`<span class="pill warn">↑ ${g.ahead} da pushare</span>`);
    if (g.behind) pills.push(`<span class="pill warn">↓ ${g.behind} da pullare</span>`);
    if (!g.ahead && !g.behind) pills.push(`<span class="pill ok">Allineato con origin</span>`);
  } else if (g.remote) pills.push(`<span class="pill">Nessun upstream</span>`);
  const remote = g.remote
    ? (() => { const r = remoteUrl(g.remote); return `<a class="remote" href="${PL.esc(r.url)}" data-ext>${PL.esc(r.label)} ↗</a>`; })()
    : `<span class="remote none">nessun remote · solo locale</span>`;
  const commit = g.commit
    ? `<div class="commit"><code>${g.commit.hash}</code><span class="msg">${PL.esc(g.commit.msg)}</span><span class="who">${PL.esc(g.commit.author)} · ${g.commit.ago}</span></div>`
    : `<div class="commit"><span class="who">Nessun commit ancora</span></div>`;
  return `<div class="git"><div class="top">${pills.join('')}${remote}</div>${commit}</div>`;
}

function detail(p, path) {
  const k = key(path, p.name);
  return `<div class="in">
    <div class="head">
      <div>
        <div class="path">~/Development/${PL.esc(k)}</div>
        <h1>${PL.esc(p.name)}</h1>
        <span class="tag"><span class="dot" style="background:${PL.LANG[p.lang]}"></span>${p.lang}</span>
      </div>
      <div class="acts">
        <div class="open" id="open"></div>
        <button class="ibtn" id="explorer" title="Mostra in Esplora file (Ctrl E)" aria-label="Mostra in Esplora file">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3z"/></svg>
        </button>
      </div>
    </div>
    ${gitBlock(k)}
    <div class="readme"><div class="bar"><span>README.md</span></div><div class="md" id="md"><div class="placeholder">Caricamento README…</div></div></div>
  </div>`;
}

async function loadReadme(k) {
  const box = $('md');
  if (!READMES.has(k)) {
    box.outerHTML = `<div class="placeholder">Nessun README in questa cartella.${PL.get(S.path) ? '' : ''}</div>`;
    return;
  }
  try {
    if (!readmeCache.has(k)) {
      const res = await fetch('shared/readme/' + encodeURIComponent(k.replaceAll('/', '__')) + '.md');
      if (!res.ok) throw new Error(res.status);
      readmeCache.set(k, await res.text());
    }
    if (!document.body.contains(box)) return; // nel frattempo è cambiata la selezione
    box.innerHTML = window.marked ? marked.parse(readmeCache.get(k)) : `<pre>${PL.esc(readmeCache.get(k))}</pre>`;
  } catch (e) {
    box.innerHTML = `<div class="placeholder">Impossibile caricare il README. Apri il mockup con Five Server: da file:// il fetch non funziona.</div>`;
  }
}

// ---------- ricerca: palette flottante (Ctrl K / ⌘K) ----------
// Ambito = cartella corrente. ⌫ su input vuoto o la riga "Cerca ovunque" allargano a tutto Development.
const P = { open: false, q: '', global: false, idx: 0, items: [] };
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
const MOD = isMac ? '⌘' : 'Ctrl';
$('kbd-k').textContent = MOD + ' K';

function openPalette() {
  closeCtx(); closeModal(); S.menu = false;
  Object.assign(P, { open: true, q: '', global: !S.path.length, idx: 0 });
  $('palette').innerHTML = `<div class="pal-bg" data-palbg><div class="pal" role="dialog" aria-modal="true" aria-label="Cerca progetti">

function renderPalette() {
  const here = S.path.at(-1) || 'Development';
  $('pal-scope').innerHTML = P.global
    ? `<span class="chip global">ovunque</span>`
    : `<span class="chip" title="Solo dentro ${PL.esc(S.path.join('/'))}">in ${PL.esc(here)}<button data-palglobal title="Cerca ovunque (⌫)">×</button></span>`;
  $('pal-q').placeholder = P.global ? 'Cerca in tutto Development…' : `Cerca in ${here}…`;
  const ini = (n) => n.replace(/[^a-z0-9]/gi, '').slice(0, 2).toUpperCase();
  let html;
  // "ovunque" senza testo: gli ultimi 5 progetti aperti con "Apri con"
  if (P.global && !P.q) {
    const rec = recentEntries().slice(0, 5);
    P.items = rec.map((e) => ({ kind: 'proj', e }));
    P.idx = Math.min(P.idx, Math.max(0, P.items.length - 1));
    html = `<div class="sec">Aperti di recente</div>`;
    if (!rec.length) html += `<div class="none">Non hai ancora aperto nessun progetto. Scrivi per cercare in tutto Development.</div>`;
    html += P.items.map((it, i) => {
      const p = it.e.project, l = LAUNCHERS.find((x) => x.id === it.e.launcher);
      return `<div class="it${i === P.idx ? ' on' : ''}" role="option" data-pi="${i}"><div class="ib" style="background:${PL.LANG[p.lang] || '#888'}">${ini(p.name)}</div>
        <div class="m"><div class="t">${PL.esc(p.name)}</div><div class="s">${PL.esc(it.e.path.join('/') || 'Development')}</div></div>
        <span class="w" style="display:flex;align-items:center;gap:6px">${l ? lico(l) : ''}${ago(it.e.at)}</span></div>`;
    }).join('');
  } else {
    const r = PL.search(P.q, P.global ? [] : S.path);
    const list = P.q ? r.here : r.here.slice(0, 8);
    P.items = list.map((e) => ({ kind: 'proj', e }));
    if (!P.global && P.q) P.items.push({ kind: 'glob', n: r.elsewhere.length });
    P.idx = Math.min(P.idx, Math.max(0, P.items.length - 1));
    html = `<div class="sec">${P.q ? (P.global ? 'Ovunque' : 'In ' + PL.esc(S.path.join('/'))) + ' · ' + r.here.length : 'In ' + PL.esc(here)}</div>`;
    if (!list.length) html += `<div class="none">Nessun progetto${P.global ? '' : ' in ' + PL.esc(here)}${P.q ? ` per “${PL.esc(P.q)}”` : ''}.</div>`;
    html += P.items.map((it, i) => {
      const on = i === P.idx ? ' on' : '';
      if (it.kind === 'glob') return `<div class="it glob${on}" data-pi="${i}"><div class="ib" style="background:transparent;border:1px dashed currentColor;color:inherit">⌕</div><div class="m"><div class="t">Cerca “${PL.esc(P.q)}” ovunque in Development</div><div class="s">${it.n} ${it.n === 1 ? 'risultato' : 'risultati'} fuori da ${PL.esc(here)}</div></div><span class="w">⇥</span></div>`;
      const p = it.e.project;
      const where = (P.global ? it.e.path : it.e.path.slice(S.path.length)).join('/');
      return `<div class="it${on}" role="option" data-pi="${i}"><div class="ib" style="background:${PL.LANG[p.lang]}">${ini(p.name)}</div>
        <div class="m"><div class="t">${PL.highlight(p.name, P.q)}</div><div class="s">${p.desc ? PL.highlight(p.desc, P.q) : p.lang}</div></div>
        <span class="w">${PL.esc(where)}</span></div>`;
    }).join('');
  }
  $('pal-list').innerHTML = html;
  const on = $('pal-list').querySelector('.it.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
}

function paletteGo(i, launch) {
  const it = P.items[i];
  if (!it) return;
  if (it.kind === 'glob') { P.global = true; P.idx = 0; renderPalette(); return; }
  closePalette();
  S.path = it.e.path; S.sel = it.e.project.name;
  render();
  if (launch) { const ls = enabled(); if (ls.length) doLaunch((ls.find((l) => l.id === defaultId) || ls[0]).id); }
}

function paletteKey(e) {
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'ArrowDown') { e.preventDefault(); P.idx = Math.min(P.items.length - 1, P.idx + 1); renderPalette(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); P.idx = Math.max(0, P.idx - 1); renderPalette(); }
  else if (e.key === 'Enter') { e.preventDefault(); paletteGo(P.idx, mod); }
  else if (e.key === 'Tab') { e.preventDefault(); if (S.path.length) { P.global = !P.global; P.idx = 0; renderPalette(); } }
  else if (e.key === 'Backspace' && !e.target.value && !P.global) { P.global = true; renderPalette(); }
  else if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
}

});

      ...(def ? [{ label: `Apri con ${PL.esc(def.label)}`, key: '↵', run: () => { recordOpen(parent, name, def.id); PL.toast(`${def.label} → ${name}`); } }] : []),
      { label: 'Mostra in Esplora file', key: 'Ctrl E', run: () => PL.toast('Esplora file → ' + name) },
      { label: 'Copia percorso', run: () => PL.toast('Copiato: ~/Development/' + key(parent, name)) },
      '-',
      { label: 'Elimina…', key: 'Canc', danger: true, run: () => askDelete(parent, node) },
    ]
    : [
      ...(def ? [{ label: `Apri con ${PL.esc(def.label)}`, run: () => { recordOpen(parent, name, def.id); PL.toast(`${def.label} → ${name}`); } }] : []),
      { label: 'Mostra in Esplora file', key: 'Ctrl E', run: () => PL.toast('Esplora file → ' + name) },
      { label: 'Nuova cartella qui…', run: () => newFolder([...parent, name]) },
      { label: 'Clona una repository qui…', run: () => cloneDialog([...parent, name]) },
      '-',
      { label: 'Elimina…', key: 'Canc', danger: true, run: () => askDelete(parent, node) },
    ];
  openCtx(x, y, items);
}

function addMenu(i, x, y) {
  const at = S.path.slice(0, i);
  openCtx(x, y, [
    { label: 'Nuova cartella…', key: 'Ctrl Shift N', run: () => newFolder(at) },
    { label: 'Clona una repository qui…', run: () => cloneDialog(at) },
  ]);
}

// ---------- dialog ----------
function openModal(html) {
  closeCtx();
  $('modal').innerHTML = `<div class="backdrop" data-backdrop><div class="dlg" role="dialog" aria-modal="true">${html}</div></div>`;
  const dlg = $('modal').querySelector('.dlg');
  const f = dlg.querySelector('input[type=text]') || dlg.querySelector('.ft button:last-child');
  if (f) setTimeout(() => f.focus(), 0);
  return dlg;
}
function closeModal() { $('modal').innerHTML = ''; }
$('modal').addEventListener('mousedown', (e) => { if (e.target.dataset.backdrop !== undefined) closeModal(); });

const INVALID = /[\\/:*?"<>|]/;
// Come PL.get ma restituisce null se il percorso non esiste (PL.get ricade sulla root).
function findDir(path) {
  let node = PL.TREE;
  for (const seg of path) {
    node = (node.children || []).find((c) => c.type === 'dir' && c.name === seg);
    if (!node) return null;
  }
  return node;
}
function validName(parentPath, name) {
  if (!name.trim()) return 'Inserisci un nome.';
  if (INVALID.test(name)) return 'Caratteri non ammessi: \\ / : * ? " < > |';
  if (/[. ]$/.test(name)) return 'Il nome non può finire con un punto o uno spazio.';
  const parent = findDir(parentPath);
  if (parent && parent.children.some((c) => c.name.toLowerCase() === name.trim().toLowerCase())) return 'Esiste già un elemento con questo nome.';
  return '';
}

function newFolder(parentPath) {
  const where = ['Development', ...parentPath].join('/');
  const dlg = openModal(`<h3>Nuova cartella</h3>
    <div class="bd"><label>Nome<input type="text" id="nf-name" placeholder="es. Ingegneria del Software" autocomplete="off"></label>
    <div class="hint" id="nf-hint">Verrà creata in <code>~/${PL.esc(where)}</code></div></div>
    <div class="ft"><button data-close>Annulla</button><button class="p" id="nf-ok" disabled>Crea cartella</button></div>`);
  const inp = dlg.querySelector('#nf-name'), ok = dlg.querySelector('#nf-ok'), hint = dlg.querySelector('#nf-hint');
  const check = () => {
    const err = inp.value ? validName(parentPath, inp.value) : '';
    hint.className = 'hint' + (err ? ' err' : '');
    hint.innerHTML = err || `Verrà creata in <code>~/${PL.esc(where)}</code>`;
    ok.disabled = !inp.value || !!err;
  };
  const create = () => {
    if (ok.disabled) return;
    const name = inp.value.trim();
    PL.get(parentPath).children.push({ type: 'dir', name, children: [] });
    closeModal();
    S.path = [...parentPath, name]; S.sel = null;
    render();
    PL.toast('Cartella creata: ' + name);
  };
  inp.addEventListener('input', check);
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') create(); });
  ok.onclick = create;
}

function deleteNode(parentPath, node) {
  const kids = PL.get(parentPath).children;
  kids.splice(kids.indexOf(node), 1);
  const full = [...parentPath, node.name];
  // se stavamo guardando dentro l'elemento eliminato, torna al genitore
  if (full.every((s, i) => S.path[i] === s)) S.path = parentPath;
  if (node.type === 'project' && S.sel === node.name && S.path.join('/') === parentPath.join('/')) S.sel = null;
  render();
  PL.toast(`"${node.name}" spostato nel Cestino`);
}

function askDelete(parentPath, node) {
  const isEmptyDir = node.type === 'dir' && !node.children.length;
  if (isEmptyDir) return deleteNode(parentPath, node); // vuota: nessuna conferma
  const k = key(parentPath, node.name);
  let body;
  if (node.type === 'project') {
    const g = GIT[k];
    const warns = [];
    if (g && g.dirty) warns.push(`${g.dirty} file con modifiche non committate`);
    if (g && g.ahead) warns.push(`${g.ahead} commit non pushati`);
    if (g && !g.remote) warns.push('nessun remote: questa è l’unica copia');
    if (!g) warns.push('non è un repository git: questa potrebbe essere l’unica copia');
    body = `<p>Verrà eliminata la cartella del progetto con tutto il suo contenuto.</p>${warns.length ? `<div class="warn">Attenzione: ${warns.join(' · ')}.</div>` : ''}`;
  } else {
    const dirs = node.children.filter((c) => c.type === 'dir').length;
    const n = PL.count(node);
    body = `<p>La cartella non è vuota: contiene ${n} ${n === 1 ? 'progetto' : 'progetti'}${dirs ? ` e ${dirs} ${dirs === 1 ? 'sottocartella' : 'sottocartelle'}` : ''}.</p>
      <div class="warn">Tutto il contenuto verrà eliminato insieme alla cartella.</div>`;
  }
  const dlg = openModal(`<h3>Eliminare “${PL.esc(node.name)}”?</h3>
    <div class="bd">${body}<div class="final">~/Development/${PL.esc(k)}</div>
    <p class="hint">Verrà spostata nel Cestino, da cui potrai recuperarla.</p></div>
    <div class="ft"><button data-close>Annulla</button><button class="d" id="del-ok">Elimina</button></div>`);
  dlg.querySelector('[data-close]').focus();
  dlg.querySelector('#del-ok').onclick = () => { closeModal(); deleteNode(parentPath, node); };
}

// Riconosce host/owner/repo da URL https o ssh.
function parseRepo(url) {
  const m = url.trim().match(/^(?:https?:\/\/|git@|ssh:\/\/git@)([^/:]+)[/:]([^/]+)\/([^/]+?)(?:\.git)?\/?$/);
  return m ? { host: m[1], owner: m[2], repo: m[3] } : null;
}

function mkdirp(path) {
  let node = PL.TREE;
  for (const seg of path) {
    let next = node.children.find((c) => c.type === 'dir' && c.name === seg);
    if (!next) { next = { type: 'dir', name: seg, children: [] }; node.children.push(next); }
    node = next;
  }
  return node;
}

function cloneDialog(at) {
  // at = cartella da cui è stato aperto (null = dalla navbar: si propone la struttura github/<owner>)
  const dlg = openModal(`<h3>Clona una repository</h3>
    <div class="bd">
      <label>URL della repository<input type="text" id="cl-url" placeholder="https://github.com/utente/repo.git oppure git@github.com:utente/repo.git" autocomplete="off" spellcheck="false"></label>
      <label>Cartella di destinazione<div class="pre"><span>~/Development/</span><input type="text" id="cl-dir" value="${PL.esc((at || S.path).join('/'))}" autocomplete="off" spellcheck="false"></div><span class="hint" id="cl-sug"></span></label>
      <label>Nome della cartella<input type="text" id="cl-name" autocomplete="off" spellcheck="false"></label>
      <div class="final" id="cl-final">—</div>
      <label class="chk"><input type="checkbox" id="cl-open" checked> Apri con ${PL.esc((enabled().find((l) => l.id === defaultId) || enabled()[0] || { label: 'l’editor' }).label)} al termine</label>
      <div class="prog" id="cl-prog" hidden><i></i></div><div class="hint" id="cl-status"></div>
    </div>
    <div class="ft"><button data-close>Annulla</button><button class="p" id="cl-ok" disabled>Clona</button></div>`);
  const url = dlg.querySelector('#cl-url'), dir = dlg.querySelector('#cl-dir'), name = dlg.querySelector('#cl-name');
  const sug = dlg.querySelector('#cl-sug'), fin = dlg.querySelector('#cl-final'), ok = dlg.querySelector('#cl-ok');
  let nameTouched = false, dirTouched = !!at;
  const update = () => {
    const r = parseRepo(url.value);
    if (r && !nameTouched) name.value = r.repo;
    sug.innerHTML = '';
    if (r && r.host === 'github.com') {
      const s = `github/${r.owner}`;
      if (!dirTouched) dir.value = s;
      else if (dir.value !== s) sug.innerHTML = `Suggerito dalla tua struttura: <button type="button" data-sug="${PL.esc(s)}">github/${PL.esc(r.owner)}</button>`;
      sug.className = 'hint sug';
    }
    const segs = dir.value.split('/').filter(Boolean);
    const err = !url.value ? '' : !r ? 'URL non riconosciuto.' : (segs.some((s) => INVALID.test(s)) ? 'Percorso non valido.' : validName(segs, name.value));
    fin.textContent = '~/Development/' + [...segs, name.value].filter(Boolean).join('/');
    const st = dlg.querySelector('#cl-status');
    st.className = 'hint' + (err ? ' err' : '');
    st.textContent = err || (r && !findDir(segs) ? 'Le cartelle mancanti verranno create.' : '');
    ok.disabled = !r || !!err;
  };
  url.addEventListener('input', update);
  dir.addEventListener('input', () => { dirTouched = true; update(); });
  name.addEventListener('input', () => { nameTouched = true; update(); });
  dlg.addEventListener('click', (e) => { const b = e.target.closest('[data-sug]'); if (b) { dir.value = b.dataset.sug; update(); } });
  const run = () => {
    if (ok.disabled) return;
    const r = parseRepo(url.value), segs = dir.value.split('/').filter(Boolean), nm = name.value.trim();
    ok.disabled = true; [url, dir, name].forEach((x) => (x.disabled = true));
    const prog = dlg.querySelector('#cl-prog'), bar = prog.firstChild, st = dlg.querySelector('#cl-status');
    prog.hidden = false;
    const steps = ['Connessione a ' + r.host + '…', 'Ricezione oggetti: 38%', 'Ricezione oggetti: 100%', 'Risoluzione delta…', 'Checkout dei file…'];
    let n = 0;
    const tick = setInterval(() => {
      st.className = 'hint'; st.textContent = steps[n]; bar.style.width = ((n + 1) / steps.length * 100) + '%';
      if (++n < steps.length) return;
      clearInterval(tick);
      setTimeout(() => {
        mkdirp(segs).children.push({ type: 'project', name: nm, lang: 'Altro', desc: '' });
        GIT[key(segs, nm)] = { branch: 'main', remote: url.value.trim(), commit: { hash: 'a1b2c3d', msg: '(ultimo commit remoto)', author: r.owner, ago: 'ora' }, dirty: 0, behind: 0, ahead: 0 };
        const openAfter = dlg.querySelector('#cl-open').checked;
        closeModal();
        S.path = segs; S.sel = nm;
        render();
        PL.toast(openAfter ? `Clonato. Apertura di ${nm}…` : `Clonato in ~/Development/${key(segs, nm)}`);
      }, 250);
    }, 350);
  };
  [url, dir, name].forEach((x) => x.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); }));
  ok.onclick = run;
  dlg.querySelector('[data-close]').onclick = closeModal;
  update();
}

// ---------- eventi ----------
function doLaunch(id) {
  const t = target();
  if (!t) return;
  const l = LAUNCHERS.find((x) => x.id === id);
  recordOpen(t.parent, t.name, id);
  PL.toast(`${l.label} → ${t.name}`);
}

// Override manuale (nell'app: salvato in config.json, la cartella su disco non viene toccata).
function markAsProject() {
  const parentPath = S.path.slice(0, -1);
  const parent = PL.get(parentPath);
  const node = PL.get(S.path);
  parent.children.splice(parent.children.indexOf(node), 1, { type: 'project', name: node.name, lang: 'Altro', desc: '' });
  OVERRIDES.push({ path: S.path.join('/'), as: 'Progetto' });
  S.path = parentPath; S.sel = node.name;
  render();
  PL.toast(`"${node.name}" segnato come progetto`);
}

document.addEventListener('click', (ev) => {
  if (ev.target.closest('#settings, #ctx, #palette')) return;
  if (ev.target.closest('#settings-btn')) return openSettings();
  if (ev.target.closest('#theme-btn')) return setTheme(resolvedTheme() === 'dark' ? 'light' : 'dark');
  if (ev.target.closest('#modal')) { if (ev.target.closest('[data-close]')) closeModal(); return; }
  if ($('ctx').innerHTML) closeCtx();
  const mo = ev.target.closest('[data-more]');
  if (mo) { ev.stopPropagation(); const r = mo.getBoundingClientRect(); rowMenu(+mo.dataset.more, mo.dataset.name, r.left, r.bottom + 4); return; }
  const ad = ev.target.closest('[data-add]');
  if (ad) { const r = ad.getBoundingClientRect(); addMenu(+ad.dataset.add, r.left, r.bottom + 4); return; }
  const nd = ev.target.closest('[data-newdir]');
  if (nd) return newFolder(S.path.slice(0, +nd.dataset.newdir));
  const ch = ev.target.closest('[data-clonehere]');
  if (ch) return cloneDialog(S.path.slice(0, +ch.dataset.clonehere));
  if (ev.target.closest('#clone-btn')) return cloneDialog(null);
  if (ev.target.closest('#search-btn')) return openPalette();
  if (ev.target.closest('[data-markproj]')) return markAsProject();
  const t = ev.target.closest('button, .res, a[data-ext], .md a');
  if (!t) { if (S.menu) { S.menu = false; renderOpen(); } return; }
  if (t.matches('.md a, a[data-ext]')) { ev.preventDefault(); PL.toast('Link aperto nel browser: ' + t.getAttribute('href')); return; }
  if (t.dataset.caret !== undefined) { S.menu = !S.menu; renderOpen(); return; }
  if (t.dataset.launch) { S.menu = false; renderOpen(); doLaunch(t.dataset.launch); return; }
  if (t.dataset.settings !== undefined) { openSettings('launcher'); return; }
  if (t.id === 'explorer') { PL.toast('Esplora file → ' + (target() ? target().name : (S.path.at(-1) || 'Development'))); return; }
  if (S.menu) S.menu = false;
  if (t.dataset.up !== undefined) { S.path = S.path.slice(0, +t.dataset.up); S.sel = null; }
  else if (t.dataset.dir !== undefined) { S.path = [...S.path.slice(0, +t.dataset.dir), t.dataset.name]; S.sel = null; }
  else if (t.dataset.proj !== undefined) { S.path = S.path.slice(0, +t.dataset.proj); S.sel = t.dataset.name; }
  else return;
  render();
});

document.addEventListener('contextmenu', (e) => {
  const r = e.target.closest('.row[data-name]');
  if (!r || e.target.closest('#modal')) return;
  e.preventDefault();
  rowMenu(+(r.dataset.dir ?? r.dataset.proj), r.dataset.name, e.clientX, e.clientY);
});
document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  // Ctrl K / ⌘K apre (o chiude) la ricerca flottante da qualsiasi punto
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); if (SET.open) closeSettings(); P.open ? closePalette() : openPalette(); return; }
  // Ctrl P / ⌘P (e Ctrl ,) aprono le impostazioni; nel browser blocca anche la stampa
  if (mod && (e.key.toLowerCase() === 'p' || e.key === ',')) { e.preventDefault(); SET.open ? closeSettings() : openSettings(); return; }
  if (SET.open) { if (e.key === 'Escape') closeSettings(); return; }
  if (P.open) return; // la palette gestisce i suoi tasti
  if ($('modal').innerHTML) { if (e.key === 'Escape') closeModal(); return; }
  if (e.key === 'Escape' && $('ctx').innerHTML) { closeCtx(); return; }
  if (e.key === 'Escape' && S.menu) { S.menu = false; renderOpen(); return; }
  if (e.target.matches('input, textarea')) return;
  if (mod && e.shiftKey && e.key.toLowerCase() === 'n') { e.preventDefault(); newFolder(S.path); return; }
  if (e.key === 'Delete') {
    const sel = selected();
    if (sel) askDelete(sel.path, sel.project);
    return;
  }
  if (e.key === '/') { e.preventDefault(); openPalette(); return; }
  const ls = enabled();
  if (e.key === 'Enter' && ls.length) { doLaunch((ls.find((l) => l.id === defaultId) || ls[0]).id); }
  else if (e.ctrlKey && /^[1-9]$/.test(e.key) && ls[+e.key - 1]) { e.preventDefault(); doLaunch(ls[+e.key - 1].id); }
  else if (e.ctrlKey && e.key.toLowerCase() === 'e') { e.preventDefault(); if ($('explorer')) $('explorer').click(); }
});
let lastFit = fitCols();
window.addEventListener('resize', () => { const f = fitCols(); if (f !== lastFit) { lastFit = f; render(); } });
render();
</script>
