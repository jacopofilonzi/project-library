<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 · Tipografico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #131312; --ink: #f1ede4; --mute: #8e8a80; --line: #2b2a27; --accent: #e9c46a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 'Instrument Sans', system-ui, sans-serif; min-height: 100vh; padding: 48px 64px 140px; }
  .crumbs { font-size: 14px; color: var(--mute); display: flex; gap: 8px; flex-wrap: wrap; }
  .crumbs a { color: var(--mute); text-decoration: none; cursor: pointer; }
  .crumbs a:hover { color: var(--ink); }
  h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(64px, 11vw, 168px); line-height: .9; letter-spacing: -.02em; margin: 14px 0 6px; word-break: break-word; }
  h1 em { color: var(--accent); }
  .sub { color: var(--mute); margin-bottom: 40px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 16px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .row:last-child { border-bottom: 1px solid var(--line); }
  .row .n { font-family: 'Instrument Serif', serif; font-size: 38px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.dir .n { font-style: italic; }
  .row.dir .n sup { font-family: 'Instrument Sans', sans-serif; font-style: normal; font-size: 13px; color: var(--accent); margin-left: 6px; vertical-align: super; }
  .row .d { color: var(--mute); font-size: 14px; margin-top: 2px; }
  .row .d code { font: inherit; color: #b9b4a7; }
  .acts { display: flex; gap: 8px; opacity: 0; transition: opacity .12s; }
  .row:hover .acts, .row:focus-within .acts { opacity: 1; }
  .acts button { background: transparent; border: 1px solid #45433e; color: var(--ink); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .acts button:hover { border-color: var(--ink); }
  .acts button.p { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .arrow { font-size: 26px; color: var(--mute); }
  .row.glob .n { color: var(--accent); font-style: italic; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--mute); margin: 34px 0 10px; }
  mark { background: none; color: var(--accent); }
  .dock { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); background: #1f1e1c; border: 1px solid #3a3935; border-radius: 999px; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .dock input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--ink); font: inherit; font-size: 16px; padding: 8px 0; }
  .dock .scope { background: #2d2c29; border: 0; color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .dock .scope b { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<nav class="crumbs" id="crumbs" aria-label="Percorso"></nav>
<h1 id="title"></h1>
<div class="sub" id="sub"></div>
<div id="list"></div>

<div class="dock">
  <label for="q" style="position:absolute;left:-9999px">Cerca</label>
  <input id="q" placeholder="Cerca…" autocomplete="off">
  <button class="scope" id="scope" title="Cambia ambito"></button>
</div>

<script src="shared/data.js"></script>
<script>
const S = { path: ['github', 'jacopofilonzi'], q: '', global: false };
const $ = (id) => document.getElementById(id);
const acts = (name) => `<div class="acts">${PL.LAUNCHERS.map((l, i) => `<button class="${i === 0 ? 'p' : ''}" data-launch="${l.id}" data-name="${PL.esc(name)}">${l.label}</button>`).join('')}</div>`;

function render() {
  $('crumbs').innerHTML = ['Development', ...S.path].map((s, i) => `<a data-up="${i}">${PL.esc(s)}</a>`).join('<span>/</span>');
  const here = S.path.at(-1) || 'Development';
  $('scope').innerHTML = S.global ? 'in <b>tutto Development</b>' : `in <b>${PL.esc(here)}</b>`;
  if (!S.q && !S.global) {
    const node = PL.get(S.path);
    $('title').innerHTML = PL.esc(here);
    const dirs = (node.children || []).filter((c) => c.type === 'dir').length;
    $('sub').textContent = `${PL.count(node)} progetti${dirs ? ` · ${dirs} cartelle` : ''}`;
    $('list').innerHTML = PL.sorted(node).map((c) => c.type === 'dir'
      ? `<div class="row dir" data-dir="${PL.esc(c.name)}"><div><div class="n">${PL.esc(c.name)}<sup>${PL.count(c)}</sup></div></div><span class="arrow">→</span></div>`
      : `<div class="row"><div style="min-width:0"><div class="n">${PL.esc(c.name)}</div><div class="d">${c.desc ? PL.esc(c.desc) : c.lang}</div></div>${acts(c.name)}</div>`).join('');
    return;
  }
  const r = PL.search(S.q, S.global ? [] : S.path);
  $('title').innerHTML = S.q ? `<em>“${PL.esc(S.q)}”</em>` : '<em>ovunque</em>';
  $('sub').textContent = S.global ? `${r.here.length} risultati in tutto Development` : `${r.here.length} risultati in ${here}`;
  let html = r.here.map((e) => `<div class="row"><div style="min-width:0"><div class="n">${PL.highlight(e.project.name, S.q)}</div><div class="d"><code>${PL.esc((S.global ? e.path : e.path.slice(S.path.length)).join('/') || '.')}</code>${e.project.desc ? ' — ' + PL.highlight(e.project.desc, S.q) : ''}</div></div>${acts(e.project.name)}</div>`).join('');
  if (!S.global && S.path.length) html += `<div class="label">fuori da ${PL.esc(here)}</div><div class="row glob" data-global><div><div class="n">Cerca ovunque in Development</div><div class="d">${r.elsewhere.length} altri risultati · Ctrl ↵</div></div><span class="arrow">→</span></div>`;
  $('list').innerHTML = html;
}

document.addEventListener('click', (e) => {
  const l = e.target.closest('[data-launch]');
  if (l) return PL.launch(l.dataset.launch, { name: l.dataset.name });
  const up = e.target.closest('[data-up]');
  if (up) { S.path = S.path.slice(0, +up.dataset.up); S.q = ''; $('q').value = ''; S.global = false; return render(); }
  const d = e.target.closest('[data-dir]');
  if (d) { S.path.push(d.dataset.dir); window.scrollTo(0, 0); return render(); }
  if (e.target.closest('[data-global]')) { S.global = true; render(); }
});
$('scope').onclick = () => { S.global = !S.global; render(); $('q').focus(); };
$('q').addEventListener('input', (e) => { S.q = e.target.value; render(); });
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Backspace' && !e.target.value) { if (S.global) S.global = false; else S.path.pop(); render(); }
  if (e.key === 'Enter' && e.ctrlKey) { S.global = true; render(); }
  if (e.key === 'Escape') { e.target.value = ''; S.q = ''; S.global = false; render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); } });
render();
</script>
</body>
</html>
